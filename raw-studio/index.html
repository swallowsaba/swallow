<!doctype html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>RAW Studio</title>
    <!--
      Cross-Origin Isolation bootstrap.
      GitHub Pages cannot send COOP/COEP HTTP headers, which are required for
      SharedArrayBuffer / multi-threaded WebAssembly (OpenCV.js threads,
      ONNX Runtime Web threads). This service worker re-adds those headers on
      the client so `crossOriginIsolated === true`. It must load before the app.
    -->
    <script src="coi-serviceworker.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
