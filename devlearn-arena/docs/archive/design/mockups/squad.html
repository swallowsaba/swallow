<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>選手</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Noto+Sans+JP:wght@400;500;700;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9edf2;font-family:"Noto Sans JP",sans-serif;color:#13223a}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid #f2b632;outline-offset:2px}
@keyframes shine{0%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(260%) skewX(-18deg)}}
.shine{animation:shine 3.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>

<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: linear-gradient(180deg, #eef2f6 0%, #e3e8ee 100%);">
  <div style="position: absolute; left: 0; top: 0; right: 0; height: 72px; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: linear-gradient(100deg, #0e1b2e 0%, #13284a 70%, #1f7a4d 100%); color: #fff; box-shadow: 0 4px 0 #f2b632;">
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px;">SQUAD</span>
    <span style="font-size: 15px; font-weight: 700;">選手一覧</span>
    <div style="display: flex; gap: 6px; margin-left: 20px;">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
        <button type="button" onClick="{{ f.pick }}" style="{{ f.style }}">{{ f.label }}</button>
      </sc-for>
    </div>
    <span style="margin-left: auto; font-size: 13px; opacity: .8;">選手は覚えたコマンド。使うほど育ち、使わないと調子が落ちる</span>
  </div>

  <div style="position: absolute; left: 24px; top: 96px; width: 820px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px;">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="10">
      <button type="button" onClick="{{ c.pick }}" style="{{ c.frame }}">
        <div style="{{ c.band }}">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; line-height: 1;">{{ c.ovr }}</span>
          <span style="font-size: 12px; font-weight: 900; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.25);">{{ c.pos }}</span>
        </div>
        <div style="padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 6px; text-align: left;">
          <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px; color: #13223a;">{{ c.name }}</div>
          <div style="font-size: 12px; color: #5b6b82; min-height: 34px; line-height: 1.45;">{{ c.role }}</div>
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <span style="{{ c.condStyle }}">{{ c.cond }}</span>
            <span style="font-size: 12px; color: #6b7a90;">技 {{ c.skills }}</span>
          </div>
        </div>
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 868px; top: 96px; right: 24px; bottom: 24px; border-radius: 18px; background: #fff; box-shadow: 0 10px 30px rgba(14,27,46,.12); overflow: hidden; display: flex; flex-direction: column;">
    <div style="{{ sel.headStyle }}">
      <div class="shine" style="position: absolute; top: 0; left: 0; width: 30%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);"></div>
      <div style="position: relative; display: flex; align-items: flex-end; gap: 18px;">
        <div>
          <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 64px; line-height: .9;">{{ sel.ovr }}</div>
          <div style="font-size: 13px; font-weight: 900; margin-top: 4px;">{{ sel.pos }}</div>
        </div>
        <div style="flex-grow: 1;">
          <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 38px; line-height: 1;">{{ sel.name }}</div>
          <div style="font-size: 14px; opacity: .9; margin-top: 6px;">{{ sel.role }}</div>
        </div>
        <div style="text-align: right; font-size: 12px; opacity: .9;">
          <div>最後に使った日</div>
          <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px;">{{ sel.last }}</div>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 18px; padding: 18px 22px;">
      <svg viewBox="0 0 220 200" width="220" height="200" role="img">
        <title>能力の五角形</title>
        <desc>正確さ、速さ、応用、組み合わせ、記憶の5つの能力。</desc>
        <g fill="none" stroke="#dde4ec" stroke-width="1">
          <polygon points="110,20 196,82 163,182 57,182 24,82"></polygon>
          <polygon points="110,47 170,90 147,160 73,160 50,90"></polygon>
          <polygon points="110,73 145,99 131,138 89,138 75,99"></polygon>
        </g>
        <polygon points="{{ sel.radar }}" fill="rgba(31,122,77,.28)" stroke="#1f7a4d" stroke-width="2.5"></polygon>
        <g font-size="12" fill="#33455f" font-family="Noto Sans JP" text-anchor="middle">
          <text x="110" y="13">正確さ</text><text x="206" y="80" text-anchor="start">速さ</text>
          <text x="172" y="197">応用</text><text x="48" y="197">組み合わせ</text><text x="14" y="80" text-anchor="end">記憶</text>
        </g>
      </svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px;">
        <div style="font-weight: 900; font-size: 15px;">技</div>
        <sc-for list="{{ sel.moves }}" as="m" hint-placeholder-count="4">
          <div style="{{ m.style }}">
            <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; min-width: 44px;">{{ m.flag }}</span>
            <span style="flex-grow: 1; font-size: 13px;">{{ m.desc }}</span>
            <span style="font-size: 12px; font-weight: 700;">{{ m.state }}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="padding: 0 22px 18px;">
      <div style="font-weight: 900; font-size: 15px; margin-bottom: 8px;">成長の記録</div>
      <svg viewBox="0 0 500 90" width="100%" height="90" role="img">
        <title>習熟度の推移</title><desc>練習と試合を重ねて習熟度が上がり、使わない期間に少し下がる。</desc>
        <g stroke="#eef2f6" stroke-width="1"><line x1="0" y1="20" x2="500" y2="20"></line><line x1="0" y1="50" x2="500" y2="50"></line><line x1="0" y1="80" x2="500" y2="80"></line></g>
        <polyline points="0,80 60,72 120,60 180,58 240,44 300,47 360,36 420,30 500,24" fill="none" stroke="#1f7a4d" stroke-width="3" stroke-linejoin="round"></polyline>
        <g fill="#f2b632"><circle cx="240" cy="44" r="5"></circle><circle cx="420" cy="30" r="5"></circle></g>
        <g font-size="11" fill="#6b7a90" font-family="Noto Sans JP"><text x="226" y="36">試合で活躍</text><text x="402" y="22">技を習得</text></g>
      </svg>
    </div>

    <div style="margin-top: auto; display: flex; gap: 10px; padding: 16px 22px; background: #f5f7fa; border-top: 1px solid #e6ebf1;">
      <button type="button" style="flex-grow: 1; height: 48px; border-radius: 10px; border: none; cursor: pointer; background: linear-gradient(180deg, #3ae08a, #1f7a4d); color: #fff; font-weight: 900; font-size: 15px; box-shadow: 0 4px 0 #155a38;">この選手を練習させる</button>
      <button type="button" style="height: 48px; padding: 0 18px; border-radius: 10px; cursor: pointer; background: #fff; border: 2px solid #cfd8e3; font-weight: 700; font-size: 14px;">次の試合に登録</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'grep', filter: 'all' }; }
  renderVals() {
    const s = this.state;
    const posColor = { 探索: '#1a6fd6', 加工: '#1f7a4d', 移動: '#c46a1c', 記録: '#7a3fd0' };
    const players = [
      { name: 'grep', pos: '加工', ovr: 68, role: '大量の文から、欲しい行だけを拾う', cond: '→ 普通', cc: '#6b7a90', last: '昨日', stats: [82, 64, 58, 70, 66],
        moves: [['-i', '大文字小文字を区別しない', 'ok'], ['-r', 'ディレクトリの中を丸ごと探す', 'ok'], ['-n', '行番号を付ける', 'train'], ['-v', '一致しない行を拾う', 'lock']] },
      { name: 'cd', pos: '移動', ovr: 72, role: '別の通り（ディレクトリ）へ歩いて移る', cond: '↑ 好調', cc: '#1f7a4d', last: '今日', stats: [80, 86, 60, 62, 78],
        moves: [['..', '一つ上の通りへ戻る', 'ok'], ['~', '自分の家へ帰る', 'ok'], ['-', 'ひとつ前にいた所へ戻る', 'train'], ['/', '街の入口へ', 'ok']] },
      { name: 'ls', pos: '探索', ovr: 64, role: '今いる通りに何があるかを見回す', cond: '↓ 不調', cc: '#e04a3a', last: '5 日前', stats: [70, 74, 50, 48, 52],
        moves: [['-l', '詳しい情報も並べる', 'ok'], ['-a', '隠れた物も見せる', 'train'], ['-h', '大きさを読みやすく', 'lock'], ['-t', '新しい順に並べる', 'lock']] },
      { name: 'find', pos: '探索', ovr: 51, role: '街中を歩き回って条件に合う物を探す', cond: '↑ 好調', cc: '#1f7a4d', last: '2 日前', stats: [60, 42, 56, 54, 50],
        moves: [['-name', '名前で探す', 'ok'], ['-size', '大きさで探す', 'train'], ['-mtime', '古さで探す', 'lock'], ['-exec', '見つけた物に何かする', 'lock']] },
      { name: 'cat', pos: '加工', ovr: 60, role: '家（ファイル）の中身を読み上げる', cond: '→ 普通', cc: '#6b7a90', last: '昨日', stats: [72, 70, 44, 50, 64],
        moves: [['-n', '行番号を付ける', 'ok'], ['>', '書き出す先を決める', 'ok'], ['|', '次の選手へ渡す', 'ok'], ['-A', '見えない文字も見せる', 'lock']] },
      { name: 'pwd', pos: '探索', ovr: 58, role: '今どの通りにいるかを確かめる', cond: '→ 普通', cc: '#6b7a90', last: '3 日前', stats: [74, 80, 30, 36, 60], moves: [['', '今いる場所を答える', 'ok']] },
      { name: 'mkdir', pos: '移動', ovr: 55, role: '新しい通りを作る', cond: '↑ 好調', cc: '#1f7a4d', last: '今日', stats: [66, 60, 44, 40, 58], moves: [['-p', '途中の通りもまとめて作る', 'train']] },
      { name: 'du', pos: '探索', ovr: 42, role: 'どの通りが場所を取っているか量る', cond: '新人', cc: '#1a6fd6', last: '未使用', stats: [50, 40, 36, 44, 30], moves: [['-h', '読みやすい大きさで', 'train'], ['-s', '合計だけ出す', 'lock']] },
      { name: 'git add', pos: '記録', ovr: 38, role: '次の記録に含める物を選ぶ', cond: '新人', cc: '#1a6fd6', last: '未使用', stats: [44, 40, 30, 36, 28], moves: [['.', '全部を選ぶ', 'lock']] },
      { name: 'kubectl', pos: '記録', ovr: 0, role: 'k8s 訓練場の完成後に入団', cond: '未加入', cc: '#8a97a8', last: '—', stats: [0, 0, 0, 0, 0], moves: [] }
    ];
    const filters = [
      { id: 'all', label: '全員' }, { id: '探索', label: '探索' }, { id: '加工', label: '加工' },
      { id: '移動', label: '移動' }, { id: '記録', label: '記録' }
    ].map((f) => ({
      ...f,
      pick: () => this.setState({ filter: f.id }),
      style: 'height:34px;padding:0 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:700;border:none;background:' + (s.filter === f.id ? '#f2b632' : 'rgba(255,255,255,.12)') + ';color:' + (s.filter === f.id ? '#0e1b2e' : '#fff') + ';'
    }));
    const shown = players.filter((p) => s.filter === 'all' || p.pos === s.filter);
    const cards = shown.map((p) => {
      const on = s.sel === p.name;
      const gold = p.ovr >= 65;
      const joined = p.ovr > 0;
      return {
        ...p,
        skills: p.moves.filter((m) => m[2] === 'ok').length + ' / ' + p.moves.length,
        pick: joined ? () => this.setState({ sel: p.name }) : () => {},
        frame: 'display:flex;flex-direction:column;padding:0;border-radius:14px;overflow:hidden;cursor:' + (joined ? 'pointer' : 'default') + ';background:#fff;text-align:left;opacity:' + (joined ? '1' : '.55') + ';border:' + (on ? '3px solid #f2b632' : gold ? '2px solid #e5c268' : '2px solid #dde4ec') + ';box-shadow:' + (on ? '0 10px 24px rgba(242,182,50,.35)' : '0 4px 12px rgba(14,27,46,.07)') + ';transform:' + (on ? 'translateY(-4px)' : 'none') + ';',
        band: 'display:flex;align-items:center;justify-content:space-between;padding:10px 12px;color:#fff;background:' + (joined ? 'linear-gradient(135deg,' + posColor[p.pos] + ',#0e1b2e)' : '#9aa6b5') + ';',
        condStyle: 'font-size:12px;font-weight:700;color:' + p.cc + ';'
      };
    });
    const cur = players.find((p) => p.name === s.sel) || players[0];
    const axes = [[110, 20], [196, 82], [163, 182], [57, 182], [24, 82]];
    const radar = axes.map(([x, y], i) => {
      const r = cur.stats[i] / 100;
      return (110 + (x - 110) * r).toFixed(1) + ',' + (101 + (y - 101) * r).toFixed(1);
    }).join(' ');
    const moveStyle = {
      ok: 'display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:#eaf7f0;color:#155a38;',
      train: 'display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:#fff6e0;color:#8a5a00;',
      lock: 'display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:#f1f4f8;color:#8a97a8;'
    };
    const moveLabel = { ok: '習得済み', train: 'もう少し', lock: '未習得' };
    const sel = {
      ...cur,
      headStyle: 'position:relative;padding:20px 22px;color:#fff;overflow:hidden;background:linear-gradient(120deg,' + posColor[cur.pos] + ' 0%, #0e1b2e 85%);',
      radar,
      moves: cur.moves.map(([flag, desc, st]) => ({ flag: flag || '—', desc, state: moveLabel[st], style: moveStyle[st] }))
    };
    return { filters, cards, sel };
  }
}
</script>
</body>
</html>
