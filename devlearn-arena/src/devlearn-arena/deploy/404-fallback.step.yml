# ============================================================================
# 既存の .github/workflows/deploy.yml へ「ステップを1つ追記」するためのもの。
# 既存行は一切変更しない。追記位置は次の2ステップの“あいだ”:
#
#     - name: Build subprojects and assemble site   ← 既存
#     ★ ここに下のステップを挿入 ★
#     - name: Setup Pages                            ← 既存
#
# 役割: GitHub Pages はサイトルートの 404.html しか配信しないため、
#       サブフォルダの SPA（クライアント側ルーティング）へ直リンク・リロード
#       すると既定の 404 になる。ルートに振り替え役を1枚置いて解決する。
#       Swallow に今後入る全ての SPA が、このステップだけで直リンク対応になる。
# ============================================================================

      - name: Add SPA fallback (root 404.html)
        run: |
          set -euo pipefail
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then SITE_ROOT="/"; else SITE_ROOT="/$repo/"; fi

          cat > _site/404.html <<HTML
          <!DOCTYPE html>
          <html lang="ja">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <meta name="robots" content="noindex">
          <title>Page not found</title>
          <script>
          (function () {
            var root = "$SITE_ROOT";
            var loc = window.location;
            if (loc.search.indexOf("?p=") === 0) return;
            var path = loc.pathname;
            if (path.indexOf(root) !== 0) return;
            var rest = path.slice(root.length);
            var slash = rest.indexOf("/");
            if (slash <= 0) return;
            var project = rest.slice(0, slash);
            var sub = rest.slice(slash);
            if (sub === "/") return;
            loc.replace(root + project + "/?p=" + encodeURIComponent(sub + loc.search + loc.hash));
          })();
          </script>
          <style>
            body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
                 background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif}
            p{color:#8d96a0;font-size:14px}
            a{color:#58a6ff}
          </style>
          </head>
          <body>
          <h1>404</h1>
          <p>そのページは見つかりませんでした。</p>
          <p><a href="$SITE_ROOT">プロジェクト一覧へ</a></p>
          </body>
          </html>
          HTML

          echo "Wrote _site/404.html (site root: $SITE_ROOT)"
