<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>Pod は PVC（申請）を通して、PV（実際の領域）にデータを書く。PV は Pod の外にあるので、作り直した Pod も同じデータを読める。PVC を付けなければ、データは Pod の中に書かれ、作り直すと消える</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="pod">
    <rect x="12" y="24" width="196" height="140" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="110" y="56" text-anchor="middle" font-size="16" fill="#3ae08a">Pod（db）</text>
    <text x="110" y="84" text-anchor="middle" font-size="13" fill="#9fb0c6">データを書く場所</text>
    <text x="110" y="108" text-anchor="middle" font-size="13" fill="#eef2f6" font-family="&quot;JetBrains Mono&quot;, monospace">/var/lib/postgresql/data</text>
    <text x="110" y="140" text-anchor="middle" font-size="13" fill="#9fb0c6">いつか作り直される</text>
  </g>
  <g class="el" data-part="pvc">
    <rect x="252" y="24" width="196" height="140" rx="8" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="350" y="56" text-anchor="middle" font-size="16" fill="#f2b632">PVC（db-data）</text>
    <text x="350" y="84" text-anchor="middle" font-size="13" fill="#9fb0c6">申請: ほしい物を書く</text>
    <text x="350" y="112" text-anchor="middle" font-size="13" fill="#eef2f6" font-family="&quot;JetBrains Mono&quot;, monospace">1Gi・RWO・manual</text>
    <text x="350" y="140" text-anchor="middle" font-size="13" fill="#9fb0c6">場所は知らなくてよい</text>
  </g>
  <g class="el" data-part="pv">
    <rect x="492" y="24" width="196" height="140" rx="8" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="590" y="56" text-anchor="middle" font-size="16" fill="#5cc1ff">PV（pv-db-1）</text>
    <text x="590" y="84" text-anchor="middle" font-size="13" fill="#9fb0c6">実際の領域（Pod の外）</text>
    <text x="590" y="112" text-anchor="middle" font-size="13" fill="#eef2f6" font-family="&quot;JetBrains Mono&quot;, monospace">5Gi・RWO・manual</text>
    <text x="590" y="140" text-anchor="middle" font-size="13" fill="#9fb0c6">予約のデータが残る</text>
  </g>
  <g class="el" data-part="recreated">
    <rect x="12" y="206" width="196" height="110" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" stroke-dasharray="6 4" pointer-events="all" />
    <text x="110" y="238" text-anchor="middle" font-size="14" fill="#3ae08a">作り直した Pod</text>
    <text x="110" y="266" text-anchor="middle" font-size="13" fill="#9fb0c6">同じ PVC の名前を書く</text>
    <text x="110" y="292" text-anchor="middle" font-size="13" fill="#eef2f6">同じデータを読める</text>
  </g>
  <g class="el" data-part="layer">
    <rect x="252" y="206" width="436" height="110" rx="8" fill="none" stroke="#ff8a7a" stroke-width="2" stroke-dasharray="6 4" pointer-events="all" />
    <text x="470" y="238" text-anchor="middle" font-size="14" fill="#ff8a7a">PVC を付けないと</text>
    <text x="470" y="266" text-anchor="middle" font-size="13" fill="#eef2f6">データは Pod の中（書き込みの層）に書かれる</text>
    <text x="470" y="292" text-anchor="middle" font-size="13" fill="#9fb0c6">作り直すと消え、最初の表に戻る</text>
  </g>
  <line x1="210" y1="94" x2="248" y2="94" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <text x="229" y="84" text-anchor="middle" font-size="13" fill="#9fb0c6">付ける</text>
  <line x1="450" y1="94" x2="488" y2="94" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <text x="469" y="84" text-anchor="middle" font-size="13" fill="#9fb0c6">結ぶ</text>
  <line x1="208" y1="232" x2="300" y2="168" stroke="#3ae08a" stroke-width="2" marker-end="url(#ar)" />
</svg>
