<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>イメージとコンテナ。1 つのイメージ shop:1.4 から 3 つのコンテナを作る。コンテナの中で直した設定は、イメージには戻らない。作り直すとイメージの中身に戻る</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="image">
    <rect x="20" y="96" width="190" height="100" rx="8" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="115" y="130" text-anchor="middle" font-size="16" fill="#f2b632">イメージ shop:1.4</text>
    <text x="115" y="156" text-anchor="middle" font-size="13" fill="#9fb0c6">変わらない設計図</text>
    <text x="115" y="180" text-anchor="middle" font-size="13" fill="#eef2f6">閉館 17:00</text>
  </g>
  <g class="el" data-part="c1">
    <path d="M214 120 L324 66" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <rect x="330" y="30" width="200" height="64" rx="8" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="430" y="56" text-anchor="middle" font-size="14" fill="#5cc1ff">コンテナ 1</text>
    <text x="430" y="80" text-anchor="middle" font-size="13" fill="#eef2f6">中で直した: 閉館 19:00</text>
  </g>
  <g class="el" data-part="c2">
    <path d="M214 146 H324" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <rect x="330" y="114" width="200" height="64" rx="8" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="430" y="140" text-anchor="middle" font-size="14" fill="#5cc1ff">コンテナ 2</text>
    <text x="430" y="164" text-anchor="middle" font-size="13" fill="#eef2f6">閉館 17:00</text>
  </g>
  <g class="el" data-part="c3">
    <path d="M214 172 L324 226" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <rect x="330" y="198" width="200" height="64" rx="8" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="430" y="224" text-anchor="middle" font-size="14" fill="#5cc1ff">コンテナ 3</text>
    <text x="430" y="248" text-anchor="middle" font-size="13" fill="#eef2f6">閉館 17:00</text>
  </g>
  <g class="el" data-part="back">
    <path d="M534 62 C660 62 660 316 120 316 L116 204" fill="none" stroke="#e04a3a" stroke-width="2" stroke-dasharray="6 4" />
    <text x="612" y="190" text-anchor="middle" font-size="13" fill="#ff8a7a">戻らない</text>
  </g>
  <g class="el" data-part="note">
    <text x="230" y="296" font-size="13" fill="#9fb0c6">作り直すと、イメージの中身（17:00）に戻る</text>
  </g>
</svg>
