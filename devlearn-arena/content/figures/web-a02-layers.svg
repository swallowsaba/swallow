<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>入口の Web サーバ → アプリ → DB と、それぞれのログ</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="entry">
    <rect x="20" y="110" width="184" height="130" rx="10" fill="#f2b632" />
    <text x="112" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">入口の Web サーバ</text>
    <text x="112" y="180" text-anchor="middle" font-size="14" fill="#0a1424">error.log</text>
    <text x="112" y="202" text-anchor="middle" font-size="14" fill="#0a1424">502・504</text>
  </g>
  <g class="el" data-part="app">
    <rect x="228" y="110" width="184" height="130" rx="10" fill="#7a3fd0" />
    <text x="320" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">アプリ</text>
    <text x="320" y="180" text-anchor="middle" font-size="14" fill="#eef2f6">journalctl</text>
    <text x="320" y="202" text-anchor="middle" font-size="14" fill="#eef2f6">500</text>
  </g>
  <g class="el" data-part="db">
    <rect x="436" y="110" width="184" height="130" rx="10" fill="#1a6fd6" />
    <text x="528" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">DB</text>
    <text x="528" y="191" text-anchor="middle" font-size="14" fill="#eef2f6">接続の記録</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M204 175 L225 175" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M412 175 L433 175" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">502 は入口の先に届かない。500 はアプリの中の失敗</text>
  </g>
</svg>
