<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>TLS の握手。ブラウザが挨拶し、サーバが証明書を見せ、ブラウザが確かめ、鍵を決めてから、暗号化して話す</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="browser">
    <rect x="20" y="30" width="140" height="280" rx="12" fill="#5cc1ff" />
    <text x="90" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">ブラウザ</text>
  </g>
  <g class="el" data-part="server">
    <rect x="540" y="30" width="140" height="280" rx="12" fill="#c0392b" />
    <text x="610" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">サーバ</text>
  </g>
  <g class="el" data-part="hello">
    <path d="M160 96 H534" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <text x="350" y="88" text-anchor="middle" font-size="13" fill="#eef2f6">1 挨拶（使える暗号の一覧）</text>
  </g>
  <g class="el" data-part="cert">
    <path d="M540 140 H166" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#ar)" />
    <text x="350" y="132" text-anchor="middle" font-size="13" fill="#f2b632">2 証明書を見せる（名前 shop.example）</text>
  </g>
  <g class="el" data-part="verify">
    <rect x="176" y="156" width="250" height="46" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" />
    <text x="301" y="184" text-anchor="middle" font-size="13" fill="#3ae08a">3 確かめる（名前・期限・発行者）</text>
  </g>
  <g class="el" data-part="key">
    <path d="M160 226 H534" fill="none" stroke="#9fb0c6" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)" />
    <text x="350" y="218" text-anchor="middle" font-size="13" fill="#eef2f6">4 二人だけの鍵を決める</text>
  </g>
  <g class="el" data-part="talk">
    <rect x="160" y="252" width="380" height="40" rx="8" fill="#3ae08a" />
    <text x="350" y="278" text-anchor="middle" font-size="14" font-weight="700" fill="#0a1424">5 暗号化して話す（途中では読めない）</text>
  </g>
</svg>
