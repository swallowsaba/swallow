<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>宣言して任せる。「web を 3 つ」とあるべき形を伝えると、Kubernetes が 3 台の機械に配置する。夜中に機械が 1 台止まると、あるべき 3 と今の 2 の差に気づき、ほかの機械に作り直して 3 つに戻す。人は何もしない</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="declare">
    <rect x="20" y="30" width="170" height="80" rx="8" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="105" y="60" text-anchor="middle" font-size="14" fill="#9fb0c6">あるべき形</text>
    <text x="105" y="88" text-anchor="middle" font-size="16" fill="#f2b632">web を 3 つ</text>
  </g>
  <g class="el" data-part="k8s">
    <path d="M194 70 H246" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <rect x="250" y="30" width="170" height="80" rx="8" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="335" y="60" text-anchor="middle" font-size="16" fill="#5cc1ff">Kubernetes</text>
    <text x="335" y="88" text-anchor="middle" font-size="13" fill="#9fb0c6">今の形と比べ続ける</text>
  </g>
  <g class="el" data-part="machines">
    <rect x="460" y="20" width="220" height="44" rx="6" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="570" y="47" text-anchor="middle" font-size="14" fill="#eef2f6">機械 1: web</text>
    <rect x="460" y="72" width="220" height="44" rx="6" fill="none" stroke="#e04a3a" stroke-width="2" stroke-dasharray="6 4" pointer-events="all" />
    <text x="570" y="99" text-anchor="middle" font-size="14" fill="#ff8a7a">機械 2: 夜中に止まった</text>
    <rect x="460" y="124" width="220" height="44" rx="6" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="570" y="151" text-anchor="middle" font-size="14" fill="#eef2f6">機械 3: web・web</text>
  </g>
  <g class="el" data-part="place">
    <path d="M424 70 H456" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  </g>
  <g class="el" data-part="diff">
    <path d="M570 172 V214 H335 V114" fill="none" stroke="#9fb0c6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ar)" />
    <text x="452" y="236" text-anchor="middle" font-size="13" fill="#9fb0c6">今は 2 つ。あるべきは 3 つ</text>
  </g>
  <g class="el" data-part="fix">
    <text x="20" y="276" font-size="14" fill="#3ae08a">差に気づいて、機械 3 に作り直す → また 3 つ</text>
    <text x="20" y="302" font-size="14" fill="#eef2f6">人が手順を打つのではなく、あるべき形を伝えて任せる（宣言的）</text>
  </g>
</svg>
