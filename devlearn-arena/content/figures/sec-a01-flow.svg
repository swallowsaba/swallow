<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>情報 → 影響の確認 → 優先度 → 更新 → 確認</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="info">
    <rect x="20" y="110" width="100" height="130" rx="10" fill="#1a6fd6" />
    <text x="70" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">情報</text>
    <text x="70" y="191" text-anchor="middle" font-size="14" fill="#eef2f6">警告を読む</text>
  </g>
  <g class="el" data-part="impact">
    <rect x="144" y="110" width="100" height="130" rx="10" fill="#7a3fd0" />
    <text x="194" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">影響</text>
    <text x="194" y="180" text-anchor="middle" font-size="14" fill="#eef2f6">入っているか</text>
    <text x="194" y="202" text-anchor="middle" font-size="13" fill="#eef2f6">公開しているか</text>
  </g>
  <g class="el" data-part="priority">
    <rect x="268" y="110" width="100" height="130" rx="10" fill="#f2b632" />
    <text x="318" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">優先度</text>
    <text x="318" y="191" text-anchor="middle" font-size="14" fill="#0a1424">順を決める</text>
  </g>
  <g class="el" data-part="update">
    <rect x="392" y="110" width="100" height="130" rx="10" fill="#c0392b" />
    <text x="442" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">更新</text>
    <text x="442" y="191" text-anchor="middle" font-size="14" fill="#eef2f6">試してから</text>
  </g>
  <g class="el" data-part="verify">
    <rect x="516" y="110" width="100" height="130" rx="10" fill="#1f7a4d" />
    <text x="566" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">確認</text>
    <text x="566" y="191" text-anchor="middle" font-size="14" fill="#eef2f6">動くか</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M120 175 L141 175" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M244 175 L265 175" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M368 175 L389 175" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M492 175 L513 175" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">全部を一度に更新できないので、順を決める</text>
  </g>
</svg>
