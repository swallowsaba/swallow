<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>1 つのプロセスの中に 3 本のスレッドがあり、同じ机（メモリ）を共有する。机の値を書く時は鍵を 1 本ずつ順に使う</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="process">
    <rect x="20" y="20" width="600" height="320" rx="16" fill="none" stroke="#9aa9b5" stroke-width="3" pointer-events="all" />
    <text x="40" y="50" font-size="18" font-weight="700" fill="#9aa9b5">プロセス（PID 210）</text>
  </g>
  <g class="el" data-part="threads">
    <rect x="50" y="80" width="150" height="56" rx="10" fill="#3ae08a" />
    <rect x="50" y="152" width="150" height="56" rx="10" fill="#3ae08a" />
    <rect x="50" y="224" width="150" height="56" rx="10" fill="#3ae08a" />
    <text x="125" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">スレッド 1</text>
    <text x="125" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">スレッド 2</text>
    <text x="125" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">スレッド 3</text>
  </g>
  <g class="el" data-part="desk">
    <rect x="380" y="120" width="210" height="120" rx="12" fill="#5cc1ff" />
    <text x="485" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#0a1424">共有する机（メモリ）</text>
    <text x="485" y="196" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">在庫 10</text>
  </g>
  <g class="el" data-part="access">
    <path d="M204 108 Q290 120 374 160" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M204 180 H374" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M204 252 Q290 240 374 200" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <text x="290" y="306" text-anchor="middle" font-size="14" fill="#eef2f6">3 本とも同じ値を読み書きできる</text>
  </g>
  <g class="el" data-part="lock">
    <rect x="420" y="262" width="130" height="44" rx="10" fill="#f2b632" />
    <text x="485" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">鍵は 1 本</text>
  </g>
</svg>
