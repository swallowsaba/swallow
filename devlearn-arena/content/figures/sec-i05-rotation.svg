<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>秘密は保管場所に置き、動かす時にだけ渡し、定期的に取り換える</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="store">
    <rect x="20" y="120" width="184" height="110" rx="10" fill="#1a6fd6" />
    <text x="112" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">秘密の保管場所</text>
    <text x="112" y="191" text-anchor="middle" font-size="14" fill="#eef2f6">読める人を絞る</text>
  </g>
  <g class="el" data-part="pass">
    <rect x="228" y="120" width="184" height="110" rx="10" fill="#1f7a4d" />
    <text x="320" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">動かす時に渡す</text>
    <text x="320" y="191" text-anchor="middle" font-size="14" fill="#eef2f6">コードに書かない</text>
  </g>
  <g class="el" data-part="rotate">
    <rect x="436" y="120" width="184" height="110" rx="10" fill="#7a3fd0" />
    <text x="528" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">定期的に取り換える</text>
    <text x="528" y="191" text-anchor="middle" font-size="14" fill="#eef2f6">新 → 切替 → 旧の無効化</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M204 175 L225 175" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M412 175 L433 175" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">取り換えの順: 新しい鍵を足す → 使う側を切り替える → 古い鍵を消す</text>
  </g>
</svg>
