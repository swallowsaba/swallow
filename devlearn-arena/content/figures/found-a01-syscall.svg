<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>アプリとカーネルの境界にある窓口</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="app">
    <rect x="20" y="40" width="600" height="80" rx="10" fill="#1a6fd6" />
    <text x="320" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">アプリ（利用者の領域）</text>
    <text x="320" y="96" text-anchor="middle" font-size="14" fill="#eef2f6">機械を直接は触れない</text>
  </g>
  <g class="el" data-part="gate">
    <rect x="180" y="140" width="280" height="70" rx="10" fill="#f2b632" />
    <text x="320" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">システムコール</text>
    <text x="320" y="191" text-anchor="middle" font-size="14" fill="#0a1424">open・read・write</text>
  </g>
  <g class="el" data-part="kernel">
    <rect x="20" y="230" width="600" height="80" rx="10" fill="#7a3fd0" />
    <text x="320" y="264" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">カーネル（OS の領域）</text>
    <text x="320" y="286" text-anchor="middle" font-size="14" fill="#eef2f6">ディスク・メモリ・網を管理する</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M320 120 L320 137" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M320 210 L320 227" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">アプリは必ずカーネルを通して機械を使う</text>
  </g>
</svg>
