<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>壁で分かれた開発と運用は、申請書の手渡しで待ち、障害を押し付け合う。つないだ形では、開発と運用が共に、書く・検査・配る・見張る・振り返るの 1 つの流れを回す</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <text x="170" y="26" text-anchor="middle" font-size="16" fill="#eef2f6">壁で分かれた形</text>
  <g class="el" data-part="dev">
    <rect x="20" y="50" width="120" height="120" rx="6" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="80" y="80" text-anchor="middle" font-size="16" fill="#eef2f6">開発</text>
    <text x="80" y="110" text-anchor="middle" font-size="13" fill="#9fb0c6">書く</text>
    <text x="80" y="132" text-anchor="middle" font-size="13" fill="#9fb0c6">手元で検査</text>
  </g>
  <g class="el" data-part="wall">
    <rect x="164" y="40" width="12" height="140" fill="#9aa9b5" />
    <line x1="142" y1="200" x2="198" y2="200" stroke="#ff8a7a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)" />
    <text x="170" y="226" text-anchor="middle" font-size="13" fill="#ff8a7a">申請書の手渡し</text>
    <text x="170" y="246" text-anchor="middle" font-size="13" fill="#ff8a7a">5 日待ち</text>
  </g>
  <g class="el" data-part="ops">
    <rect x="200" y="50" width="120" height="120" rx="6" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="260" y="80" text-anchor="middle" font-size="16" fill="#eef2f6">運用</text>
    <text x="260" y="110" text-anchor="middle" font-size="13" fill="#9fb0c6">手で配る</text>
    <text x="260" y="132" text-anchor="middle" font-size="13" fill="#9fb0c6">見張る</text>
  </g>
  <text x="170" y="290" text-anchor="middle" font-size="13" fill="#9fb0c6">止まると「そっちのせい」と言い合う</text>
  <line x1="350" y1="30" x2="350" y2="300" stroke="#9aa9b5" stroke-width="1" stroke-dasharray="3 5" />
  <text x="525" y="26" text-anchor="middle" font-size="16" fill="#eef2f6">つないだ形</text>
  <g class="el" data-part="loop">
    <ellipse cx="525" cy="165" rx="140" ry="105" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="525" y="160" text-anchor="middle" font-size="16" fill="#eef2f6">開発と運用が共に</text>
    <text x="525" y="182" text-anchor="middle" font-size="13" fill="#9fb0c6">同じ目標・同じ流れ</text>
    <text x="525" y="74" text-anchor="middle" font-size="13" fill="#eef2f6">書く</text>
    <text x="652" y="140" text-anchor="middle" font-size="13" fill="#eef2f6">検査</text>
    <text x="620" y="248" text-anchor="middle" font-size="13" fill="#eef2f6">配る</text>
    <text x="430" y="248" text-anchor="middle" font-size="13" fill="#eef2f6">見張る</text>
    <text x="396" y="140" text-anchor="middle" font-size="13" fill="#eef2f6">振り返る</text>
  </g>
  <text x="525" y="306" text-anchor="middle" font-size="13" fill="#9fb0c6">手渡しが無く、速さと安定を両立する</text>
</svg>
