<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>shop.example の画面が、別のサイト api.example の API を呼ぶ。返事に Access-Control-Allow-Origin の許可が無ければ、ブラウザが中身を画面に渡さずに止める。止めるのはサーバではなくブラウザ</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="browser">
    <rect x="20" y="40" width="250" height="200" rx="12" fill="none" stroke="#5cc1ff" stroke-width="2" />
    <text x="40" y="66" font-size="14" font-weight="700" fill="#eef2f6">ブラウザ</text>
  </g>
  <g class="el" data-part="page">
    <rect x="40" y="84" width="210" height="64" rx="8" fill="#5cc1ff" />
    <text x="145" y="110" text-anchor="middle" font-size="13" fill="#0a1424">画面（送り元）</text>
    <text x="145" y="132" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="13" fill="#0a1424">https://shop.example</text>
  </g>
  <g class="el" data-part="api">
    <rect x="460" y="84" width="220" height="64" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" />
    <text x="570" y="110" text-anchor="middle" font-size="13" fill="#eef2f6">別のサイトの API</text>
    <text x="570" y="132" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="13" fill="#9fb0c6">https://api.example</text>
  </g>
  <g class="el" data-part="request">
    <path d="M250 104 H456" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <text x="353" y="96" text-anchor="middle" font-size="13" fill="#9fb0c6">依頼（送り元を添える）</text>
  </g>
  <g class="el" data-part="allow">
    <path d="M456 132 H254" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#ar)" />
    <rect x="290" y="166" width="390" height="40" rx="8" fill="none" stroke="#f2b632" stroke-width="2" />
    <text x="485" y="192" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="13" fill="#f2b632">Access-Control-Allow-Origin: https://shop.example</text>
  </g>
  <g class="el" data-part="block">
    <rect x="40" y="168" width="210" height="52" rx="8" fill="none" stroke="#e04a3a" stroke-width="2" />
    <text x="145" y="191" text-anchor="middle" font-size="13" fill="#e04a3a">許可が無ければ</text>
    <text x="145" y="210" text-anchor="middle" font-size="13" fill="#e04a3a">ブラウザが止める</text>
  </g>
  <g class="el" data-part="caption">
    <text x="350" y="276" text-anchor="middle" font-size="13" fill="#9fb0c6">止めるのはサーバではなくブラウザ。curl はこの決まりを持たないので、そのまま取れる</text>
  </g>
</svg>
