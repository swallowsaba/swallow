<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>入口 1 つから、後ろの 3 台のうち答えられる台へ振り分ける</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="entry">
    <rect x="20" y="120" width="180" height="110" rx="10" fill="#f2b632" />
    <text x="110" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">入口</text>
    <text x="110" y="191" text-anchor="middle" font-size="14" fill="#0a1424">nginx の upstream</text>
  </g>
  <g class="el" data-part="web1">
    <rect x="340" y="30" width="280" height="80" rx="10" fill="#1f7a4d" />
    <text x="480" y="64" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">web-1</text>
    <text x="480" y="86" text-anchor="middle" font-size="14" fill="#eef2f6">答える</text>
  </g>
  <g class="el" data-part="web2">
    <rect x="340" y="135" width="280" height="80" rx="10" fill="#c0392b" />
    <text x="480" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">web-2</text>
    <text x="480" y="191" text-anchor="middle" font-size="14" fill="#eef2f6">止まった → 飛ばす</text>
  </g>
  <g class="el" data-part="web3">
    <rect x="340" y="240" width="280" height="80" rx="10" fill="#1f7a4d" />
    <text x="480" y="274" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">web-3</text>
    <text x="480" y="296" text-anchor="middle" font-size="14" fill="#eef2f6">答える</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M200 160 L337 70" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M200 190 L337 280" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">止まった台に当たったら、次の台へ送り直す</text>
  </g>
</svg>
