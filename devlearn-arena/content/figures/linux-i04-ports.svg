<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>アドレス 10.0.0.5 の機械に、22 番で待つ sshd と、127.0.0.1 の 80 番でだけ待つ web がある。外からの頼みは 127.0.0.1 には届かない</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="machine">
    <rect x="200" y="30" width="480" height="270" rx="16" fill="none" stroke="#9aa9b5" stroke-width="2" />
    <text x="220" y="62" font-size="16" font-weight="700" fill="#eef2f6">サーバ web01</text>
    <text x="660" y="62" text-anchor="end" font-size="14" fill="#9fb0c6">eth0 10.0.0.5 ／ lo 127.0.0.1</text>
  </g>
  <g class="el" data-part="sshd">
    <rect x="230" y="96" width="90" height="56" rx="8" fill="#5cc1ff" />
    <text x="275" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">22</text>
    <rect x="360" y="96" width="290" height="56" rx="8" fill="#5cc1ff" />
    <text x="505" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">sshd</text>
    <text x="505" y="142" text-anchor="middle" font-size="13" fill="#0a1424">0.0.0.0（全ての口）で待つ</text>
  </g>
  <g class="el" data-part="web">
    <rect x="230" y="186" width="90" height="56" rx="8" fill="#f2b632" />
    <text x="275" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">80</text>
    <rect x="360" y="186" width="290" height="56" rx="8" fill="#f2b632" />
    <text x="505" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">web</text>
    <text x="505" y="232" text-anchor="middle" font-size="13" fill="#0a1424">127.0.0.1（自分の中だけ）で待つ</text>
  </g>
  <g class="el" data-part="outside">
    <rect x="20" y="130" width="130" height="70" rx="12" fill="#9aa9b5" />
    <text x="85" y="162" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">外の機械</text>
    <text x="85" y="184" text-anchor="middle" font-size="13" fill="#0a1424">10.0.0.5 へ送る</text>
  </g>
  <g class="el" data-part="paths">
    <path d="M150 150 C 180 140, 200 128, 224 124" fill="none" stroke="#3ae08a" stroke-width="3" marker-end="url(#arrow)" />
    <text x="170" y="118" font-size="13" fill="#3ae08a">届く</text>
    <path d="M150 182 C 176 196, 196 206, 214 210" fill="none" stroke="#e04a3a" stroke-width="3" stroke-dasharray="6 5" />
    <text x="160" y="232" font-size="13" fill="#e04a3a">届かない</text>
  </g>
  <g class="el" data-part="note">
    <text x="440" y="282" text-anchor="middle" font-size="14" fill="#9fb0c6">ss -tlnp で「アドレス:ポート」とプログラムを見る</text>
  </g>
</svg>
