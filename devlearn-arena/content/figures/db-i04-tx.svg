<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>BEGIN から COMMIT までをひとまとまりにする。途中で失敗すれば ROLLBACK で全部無かったことにする</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="begin">
    <rect x="20" y="70" width="184" height="110" rx="10" fill="#1a6fd6" />
    <text x="112" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">BEGIN</text>
    <text x="112" y="141" text-anchor="middle" font-size="14" fill="#eef2f6">ここから 1 まとまり</text>
  </g>
  <g class="el" data-part="update">
    <rect x="228" y="70" width="184" height="110" rx="10" fill="#7a3fd0" />
    <text x="320" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">更新を 2 つ</text>
    <text x="320" y="141" text-anchor="middle" font-size="14" fill="#eef2f6">減らす・増やす</text>
  </g>
  <g class="el" data-part="commit">
    <rect x="436" y="70" width="184" height="110" rx="10" fill="#1f7a4d" />
    <text x="528" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">COMMIT</text>
    <text x="528" y="141" text-anchor="middle" font-size="14" fill="#eef2f6">全部を確定する</text>
  </g>
  <g class="el" data-part="rollback">
    <rect x="200" y="225" width="240" height="80" rx="10" fill="#c0392b" />
    <text x="320" y="259" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">ROLLBACK</text>
    <text x="320" y="281" text-anchor="middle" font-size="14" fill="#eef2f6">全部を無かったことに</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M204 125 L225 125" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M412 125 L433 125" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M320 180 L320 221" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">全部か、無しか。途中の状態は残らない</text>
  </g>
</svg>
