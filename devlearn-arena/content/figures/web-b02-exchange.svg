<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>左に依頼（GET /items HTTP/1.1 と Host の見出し）、右に返事（HTTP/1.1 200 OK・見出し・本文）を並べた図</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="frame">
    <text x="170" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#5cc1ff">依頼（リクエスト）</text>
    <rect x="20" y="48" width="300" height="160" rx="10" fill="none" stroke="#5cc1ff" stroke-width="2" />
    <text x="40" y="132" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" fill="#9fb0c6">Host: shop.example</text>
    <text x="530" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#3ae08a">返事（レスポンス）</text>
    <rect x="380" y="48" width="300" height="250" rx="10" fill="none" stroke="#3ae08a" stroke-width="2" />
    <path d="M320 90 H374" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <text x="170" y="240" text-anchor="middle" font-size="13" fill="#9fb0c6">1 行目: 何をするか・どこを・版</text>
    <text x="170" y="262" text-anchor="middle" font-size="13" fill="#9fb0c6">続けて見出し（ヘッダ）</text>
  </g>
  <g class="el" data-part="method">
    <rect x="34" y="70" width="52" height="30" rx="5" fill="#5cc1ff" />
    <text x="60" y="91" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" fill="#0a1424">GET</text>
  </g>
  <g class="el" data-part="path">
    <rect x="94" y="70" width="80" height="30" rx="5" fill="#ff8a7a" />
    <text x="134" y="91" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" fill="#0a1424">/items</text>
  </g>
  <g class="el" data-part="version">
    <rect x="182" y="70" width="98" height="30" rx="5" fill="#9fb0c6" />
    <text x="231" y="91" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" fill="#0a1424">HTTP/1.1</text>
  </g>
  <g class="el" data-part="status">
    <rect x="394" y="70" width="190" height="30" rx="5" fill="#3ae08a" />
    <text x="489" y="91" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" fill="#0a1424">HTTP/1.1 200 OK</text>
    <text x="600" y="91" font-size="13" fill="#3ae08a">数字</text>
  </g>
  <g class="el" data-part="headers">
    <text x="396" y="134" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" fill="#f2b632">Content-Type: text/html</text>
    <text x="396" y="158" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" fill="#f2b632">Content-Length: 48</text>
    <text x="396" y="182" font-size="13" fill="#9fb0c6">見出し（本文の種類・大きさ）</text>
  </g>
  <g class="el" data-part="body">
    <rect x="394" y="204" width="272" height="80" rx="6" fill="none" stroke="#eef2f6" stroke-width="1.5" stroke-dasharray="5 4" />
    <text x="410" y="236" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" fill="#eef2f6">&lt;h1&gt;港町の店&lt;/h1&gt;</text>
    <text x="410" y="266" font-size="13" fill="#9fb0c6">本文（空の行の後ろ）</text>
  </g>
</svg>
