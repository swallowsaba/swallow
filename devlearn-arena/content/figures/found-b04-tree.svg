<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>/ を根とするディレクトリの木。/home/minato と /srv/app の両方に config.txt がある</title>
  <!-- 枝（根から葉へ） -->
  <g fill="none" stroke="#9fb0c6" stroke-width="2" stroke-linecap="round">
    <path d="M320 64 V88 H180 V118" />
    <path d="M320 88 H460 V118" />
    <path d="M180 162 V202" />
    <path d="M460 162 V202" />
    <path d="M180 246 V286" />
    <path d="M460 246 V286" />
  </g>
  <!-- ルート -->
  <g class="el" data-part="root">
    <circle cx="320" cy="42" r="24" fill="#f2b632" />
    <text x="320" y="51" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">/</text>
    <text x="356" y="48" font-size="13" fill="#9fb0c6">ルート</text>
  </g>
  <!-- ディレクトリ（棚の形: 見出しの付いた入れ物） -->
  <g class="el" data-part="home">
    <path d="M128 122 h36 l8 8 h60 a4 4 0 0 1 4 4 v28 a4 4 0 0 1 -4 4 h-104 a4 4 0 0 1 -4 -4 v-36 a4 4 0 0 1 4 -4 z" fill="#9aa9b5" />
    <text x="180" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">home</text>
  </g>
  <g class="el" data-part="srv">
    <path d="M408 122 h36 l8 8 h60 a4 4 0 0 1 4 4 v28 a4 4 0 0 1 -4 4 h-104 a4 4 0 0 1 -4 -4 v-36 a4 4 0 0 1 4 -4 z" fill="#9aa9b5" />
    <text x="460" y="155" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">srv</text>
  </g>
  <g class="el" data-part="minato">
    <path d="M128 206 h36 l8 8 h60 a4 4 0 0 1 4 4 v28 a4 4 0 0 1 -4 4 h-104 a4 4 0 0 1 -4 -4 v-36 a4 4 0 0 1 4 -4 z" fill="#9aa9b5" />
    <text x="180" y="239" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">minato</text>
  </g>
  <g class="el" data-part="app">
    <path d="M408 206 h36 l8 8 h60 a4 4 0 0 1 4 4 v28 a4 4 0 0 1 -4 4 h-104 a4 4 0 0 1 -4 -4 v-36 a4 4 0 0 1 4 -4 z" fill="#9aa9b5" />
    <text x="460" y="239" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">app</text>
  </g>
  <!-- ファイル（角を折った紙） -->
  <g class="el" data-part="minato-config">
    <path d="M132 290 h84 l12 12 v42 a4 4 0 0 1 -4 4 h-92 a4 4 0 0 1 -4 -4 v-50 a4 4 0 0 1 4 -4 z" fill="#eef2f6" />
    <path d="M216 290 v12 h12" fill="none" stroke="#9fb0c6" stroke-width="1.6" />
    <text x="180" y="325" text-anchor="middle" font-size="14" fill="#0a1424">config.txt</text>
    <text x="180" y="370" text-anchor="middle" font-size="13" fill="#9fb0c6">/home/minato/config.txt</text>
  </g>
  <g class="el" data-part="app-config">
    <path d="M412 290 h84 l12 12 v42 a4 4 0 0 1 -4 4 h-92 a4 4 0 0 1 -4 -4 v-50 a4 4 0 0 1 4 -4 z" fill="#eef2f6" />
    <path d="M496 290 v12 h12" fill="none" stroke="#9fb0c6" stroke-width="1.6" />
    <text x="460" y="325" text-anchor="middle" font-size="14" fill="#0a1424">config.txt</text>
    <text x="460" y="370" text-anchor="middle" font-size="13" fill="#9fb0c6">/srv/app/config.txt</text>
  </g>
</svg>
