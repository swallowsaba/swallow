<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>原因ごとの通知の山と、症状に基づく少ない通知</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="cause">
    <rect x="20" y="70" width="280" height="210" rx="10" fill="#c0392b" />
    <text x="160" y="147" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">原因ごとの通知</text>
    <text x="160" y="169" text-anchor="middle" font-size="14" fill="#eef2f6">CPU・メモリ・再起動</text>
    <text x="160" y="191" text-anchor="middle" font-size="14" fill="#eef2f6">1 晩に 200 件</text>
    <text x="160" y="213" text-anchor="middle" font-size="14" fill="#eef2f6">本当の異常を見逃す</text>
  </g>
  <g class="el" data-part="symptom">
    <rect x="340" y="70" width="280" height="210" rx="10" fill="#1f7a4d" />
    <text x="480" y="147" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">症状の通知</text>
    <text x="480" y="169" text-anchor="middle" font-size="14" fill="#eef2f6">エラー率・遅さ・目標</text>
    <text x="480" y="191" text-anchor="middle" font-size="14" fill="#eef2f6">1 晩に 5 件</text>
    <text x="480" y="213" text-anchor="middle" font-size="14" fill="#eef2f6">起きて見る意味がある</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M300 175 L337 175" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">鳴りすぎると、本当の異常を見逃す</text>
  </g>
</svg>
