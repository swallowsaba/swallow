<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>名前付きボリュームとコンテナの付け外し。docker volume create db-data で作ったボリュームを、-v db-data:/var/lib/postgresql/data で DB のコンテナに付ける。コンテナを消して作り直しても、同じボリュームを付ければ、前のデータがそのまま見える</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="old">
    <rect x="20" y="30" width="200" height="96" rx="8" fill="none" stroke="#9fb0c6" stroke-width="2" stroke-dasharray="6 4" pointer-events="all" />
    <text x="120" y="62" text-anchor="middle" font-size="16" fill="#eef2f6">前の db</text>
    <text x="120" y="90" text-anchor="middle" font-size="13" fill="#9fb0c6">消した（書き込みの層も消える）</text>
  </g>
  <g class="el" data-part="recreate">
    <path d="M226 78 H466" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <text x="346" y="66" text-anchor="middle" font-size="13" fill="#eef2f6">作り直す（同じ -v を付ける）</text>
  </g>
  <g class="el" data-part="new">
    <rect x="480" y="30" width="200" height="96" rx="8" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="580" y="62" text-anchor="middle" font-size="16" fill="#5cc1ff">新しい db</text>
    <text x="580" y="90" text-anchor="middle" font-size="13" fill="#9fb0c6">前の予約がそのまま見える</text>
  </g>
  <g class="el" data-part="volume">
    <path d="M120 130 V196 H250" fill="none" stroke="#9fb0c6" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M580 130 V196 H450" fill="none" stroke="#3ae08a" stroke-width="3" />
    <rect x="250" y="168" width="200" height="56" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="350" y="194" text-anchor="middle" font-size="16" fill="#3ae08a">db-data</text>
    <text x="350" y="214" text-anchor="middle" font-size="13" fill="#9fb0c6">コンテナの外。残る</text>
  </g>
  <g class="el" data-part="flag">
    <text x="40" y="276" font-size="14" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#eef2f6">-v</text>
    <text x="70" y="276" font-size="14" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#3ae08a">db-data</text>
    <text x="134" y="276" font-size="14" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#eef2f6">:</text>
    <text x="146" y="276" font-size="14" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#f2b632">/var/lib/postgresql/data</text>
    <text x="100" y="302" text-anchor="middle" font-size="13" fill="#3ae08a">ボリュームの名前</text>
    <text x="250" y="302" text-anchor="middle" font-size="13" fill="#f2b632">中の場所（DB が書く所）</text>
  </g>
  <g class="el" data-part="note">
    <text x="420" y="276" font-size="14" fill="#9fb0c6">中の場所を誤ると、データは</text>
    <text x="420" y="300" font-size="14" fill="#9fb0c6">書き込みの層に入り、消える</text>
  </g>
</svg>
