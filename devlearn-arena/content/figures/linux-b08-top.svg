<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="&quot;JetBrains Mono&quot;, &quot;Noto Sans JP&quot;, monospace">
  <title>top の画面。PID・利用者・CPU の割合・メモリ・命令の欄が並び、CPU を最も使う行が先頭に来る</title>
  <rect x="20" y="20" width="660" height="280" rx="12" fill="#0a1424" stroke="#9fb0c6" stroke-width="2" />
  <g class="el" data-part="pid">
    <rect x="34" y="40" width="70" height="230" fill="none" pointer-events="all" />
    <text x="44" y="70" font-size="16" font-weight="700" fill="#9fb0c6">PID</text>
    <text x="44" y="116" font-size="16" font-weight="700" fill="#f2b632">102</text>
    <text x="44" y="156" font-size="16" fill="#eef2f6">100</text>
    <text x="44" y="196" font-size="16" fill="#eef2f6">101</text>
    <text x="44" y="250" font-size="13" fill="#9fb0c6">番号</text>
  </g>
  <g class="el" data-part="user">
    <rect x="112" y="40" width="100" height="230" fill="none" pointer-events="all" />
    <text x="122" y="70" font-size="16" font-weight="700" fill="#9fb0c6">USER</text>
    <text x="122" y="116" font-size="16" fill="#eef2f6">learner</text>
    <text x="122" y="156" font-size="16" fill="#eef2f6">learner</text>
    <text x="122" y="196" font-size="16" fill="#eef2f6">learner</text>
    <text x="122" y="250" font-size="13" fill="#9fb0c6">利用者</text>
  </g>
  <g class="el" data-part="cpu">
    <rect x="222" y="40" width="96" height="230" fill="none" pointer-events="all" />
    <text x="232" y="70" font-size="16" font-weight="700" fill="#9fb0c6">%CPU</text>
    <text x="232" y="116" font-size="16" font-weight="700" fill="#f2b632">98.7</text>
    <text x="232" y="156" font-size="16" fill="#eef2f6">1.2</text>
    <text x="232" y="196" font-size="16" fill="#eef2f6">0.4</text>
    <text x="232" y="250" font-size="13" fill="#9fb0c6">CPU の割合</text>
  </g>
  <g class="el" data-part="mem">
    <rect x="330" y="40" width="110" height="230" fill="none" pointer-events="all" />
    <text x="340" y="70" font-size="16" font-weight="700" fill="#9fb0c6">MEM(MiB)</text>
    <text x="340" y="116" font-size="16" fill="#eef2f6">210</text>
    <text x="340" y="156" font-size="16" fill="#eef2f6">48</text>
    <text x="340" y="196" font-size="16" fill="#eef2f6">96</text>
    <text x="340" y="250" font-size="13" fill="#9fb0c6">メモリ</text>
  </g>
  <g class="el" data-part="command">
    <rect x="452" y="40" width="220" height="230" fill="none" pointer-events="all" />
    <text x="462" y="70" font-size="16" font-weight="700" fill="#9fb0c6">COMMAND</text>
    <text x="462" y="116" font-size="16" fill="#f2b632">python3 resize.py</text>
    <text x="462" y="156" font-size="16" fill="#eef2f6">nginx: worker</text>
    <text x="462" y="196" font-size="16" fill="#eef2f6">python3 report.py</text>
    <text x="462" y="250" font-size="13" fill="#9fb0c6">命令</text>
  </g>
  <g class="el" data-part="hot">
    <rect x="30" y="94" width="640" height="32" rx="6" fill="none" stroke="#f2b632" stroke-width="2" />
  </g>
</svg>
