<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>mkdir・cp・mv・rm の前後で、ファイルとディレクトリがどう変わるか</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="mkdir">
    <rect x="30" y="20" width="132" height="320" rx="12" fill="none" stroke="#9aa9b5" stroke-width="2" />
    <text x="96" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#f2b632">mkdir backup</text>
    <text x="96" y="66" text-anchor="middle" font-size="13" fill="#9fb0c6">ディレクトリを作る</text>
    <text x="96" y="100" text-anchor="middle" font-size="13" fill="#9fb0c6">前</text>
    <text x="96" y="140" text-anchor="middle" font-size="13" fill="#9fb0c6">（何も無い）</text>
    <path d="M96 164 V196" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
    <text x="96" y="222" text-anchor="middle" font-size="13" fill="#9fb0c6">後</text>
    <rect x="48" y="236" width="96" height="34" rx="6" fill="#ffd66b" />
    <text x="96" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#0a1424">backup/</text>
  </g>
  <g class="el" data-part="cp">
    <rect x="182" y="20" width="132" height="320" rx="12" fill="none" stroke="#9aa9b5" stroke-width="2" />
    <text x="248" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#f2b632">cp a.txt b.txt</text>
    <text x="248" y="66" text-anchor="middle" font-size="13" fill="#9fb0c6">写す（元が残る）</text>
    <text x="248" y="100" text-anchor="middle" font-size="13" fill="#9fb0c6">前</text>
    <rect x="200" y="116" width="96" height="34" rx="6" fill="#3ae08a" />
    <text x="248" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#0a1424">a.txt</text>
    <path d="M248 164 V196" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
    <text x="248" y="222" text-anchor="middle" font-size="13" fill="#9fb0c6">後</text>
    <rect x="200" y="236" width="96" height="34" rx="6" fill="#3ae08a" />
    <text x="248" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#0a1424">a.txt</text>
    <rect x="200" y="280" width="96" height="34" rx="6" fill="#3ae08a" />
    <text x="248" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#0a1424">b.txt</text>
  </g>
  <g class="el" data-part="mv">
    <rect x="334" y="20" width="132" height="320" rx="12" fill="none" stroke="#9aa9b5" stroke-width="2" />
    <text x="400" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#f2b632">mv a.txt b.txt</text>
    <text x="400" y="66" text-anchor="middle" font-size="13" fill="#9fb0c6">移す（元は無くなる）</text>
    <text x="400" y="100" text-anchor="middle" font-size="13" fill="#9fb0c6">前</text>
    <rect x="352" y="116" width="96" height="34" rx="6" fill="#3ae08a" />
    <text x="400" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#0a1424">a.txt</text>
    <path d="M400 164 V196" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
    <text x="400" y="222" text-anchor="middle" font-size="13" fill="#9fb0c6">後</text>
    <rect x="352" y="236" width="96" height="34" rx="6" fill="#3ae08a" />
    <text x="400" y="259" text-anchor="middle" font-size="13" font-weight="700" fill="#0a1424">b.txt</text>
  </g>
  <g class="el" data-part="rm">
    <rect x="486" y="20" width="132" height="320" rx="12" fill="none" stroke="#9aa9b5" stroke-width="2" />
    <text x="552" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#f2b632">rm a.txt</text>
    <text x="552" y="66" text-anchor="middle" font-size="13" fill="#9fb0c6">消す（戻せない）</text>
    <text x="552" y="100" text-anchor="middle" font-size="13" fill="#9fb0c6">前</text>
    <rect x="504" y="116" width="96" height="34" rx="6" fill="#3ae08a" />
    <text x="552" y="139" text-anchor="middle" font-size="13" font-weight="700" fill="#0a1424">a.txt</text>
    <path d="M552 164 V196" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
    <text x="552" y="222" text-anchor="middle" font-size="13" fill="#9fb0c6">後</text>
    <text x="552" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#e04a3a">（消えた）</text>
  </g>
</svg>
