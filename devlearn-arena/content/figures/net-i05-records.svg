<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>DNS のレコードの 5 つの種類。A は IPv4 のアドレス、AAAA は IPv6 のアドレス、CNAME は別の名前の別名、MX はメールを受け取るサーバ、TXT は自由な文字列</title>
  <g class="el" data-part="a">
    <rect x="20" y="20" width="90" height="40" rx="6" fill="#1a6fd6" />
    <text x="65" y="46" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" font-weight="700" fill="#eef2f6">A</text>
    <text x="130" y="46" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" fill="#eef2f6">shop.example → 203.0.113.20</text>
    <text x="680" y="46" text-anchor="end" font-size="13" fill="#9fb0c6">IPv4 のアドレス</text>
  </g>
  <g class="el" data-part="aaaa">
    <rect x="20" y="72" width="90" height="40" rx="6" fill="#1a6fd6" />
    <text x="65" y="98" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" font-weight="700" fill="#eef2f6">AAAA</text>
    <text x="130" y="98" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" fill="#eef2f6">shop.example → 2001:db8::20</text>
    <text x="680" y="98" text-anchor="end" font-size="13" fill="#9fb0c6">IPv6 のアドレス</text>
  </g>
  <g class="el" data-part="cname">
    <rect x="20" y="124" width="90" height="40" rx="6" fill="#f2b632" />
    <text x="65" y="150" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" font-weight="700" fill="#0a1424">CNAME</text>
    <text x="130" y="150" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" fill="#eef2f6">www.shop.example → shop.example</text>
    <text x="680" y="150" text-anchor="end" font-size="13" fill="#9fb0c6">別の名前の別名</text>
  </g>
  <g class="el" data-part="mx">
    <rect x="20" y="176" width="90" height="40" rx="6" fill="#3ae08a" />
    <text x="65" y="202" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" font-weight="700" fill="#0a1424">MX</text>
    <text x="130" y="202" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" fill="#eef2f6">shop.example → mail.shop.example</text>
    <text x="680" y="202" text-anchor="end" font-size="13" fill="#9fb0c6">メールを受け取る先</text>
  </g>
  <g class="el" data-part="txt">
    <rect x="20" y="228" width="90" height="40" rx="6" fill="#9aa9b5" />
    <text x="65" y="254" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" font-weight="700" fill="#0a1424">TXT</text>
    <text x="130" y="254" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" fill="#eef2f6">shop.example → "verify=7f3a…"</text>
    <text x="680" y="254" text-anchor="end" font-size="13" fill="#9fb0c6">自由な文字列（証明）</text>
  </g>
  <g class="el" data-part="caption">
    <text x="350" y="290" text-anchor="middle" font-size="13" fill="#9fb0c6">同じ名前に、用途ごとに種類の違うレコードを並べられる</text>
  </g>
</svg>
