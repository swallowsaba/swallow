<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>compose.yaml の中身。services の下に web と db の 2 つのサービスを書く。web は ports で外の 8080 番を中の 3000 番につなぎ、environment で DB の場所をサービス名 db で指し、depends_on で db を先に動かす。db は volumes でデータを書く場所に名前付きボリュームを付け、一番外の volumes で宣言する。docker compose up -d で、網とボリュームと 2 つのコンテナがまとめてできる</title>
  <text x="24" y="30" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#eef2f6">services:</text>
  <g class="el" data-part="web">
    <rect x="14" y="36" width="450" height="40" rx="4" fill="none" stroke="#5cc1ff" stroke-width="1" pointer-events="all" />
    <text x="39.6" y="51" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#5cc1ff">web:</text>
    <text x="55.2" y="70" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#eef2f6">image: city-reserve:2.0</text>
    <text x="480" y="62" font-size="14" fill="#5cc1ff">サービス（動かす物）</text>
  </g>
  <g class="el" data-part="ports">
    <rect x="14" y="78" width="450" height="40" rx="4" fill="none" stroke="#3ae08a" stroke-width="1" pointer-events="all" />
    <text x="55.2" y="93" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#3ae08a">ports:</text>
    <text x="70.8" y="112" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#3ae08a">- "8080:3000"</text>
    <text x="480" y="104" font-size="14" fill="#3ae08a">外の 8080 → 中の 3000</text>
  </g>
  <g class="el" data-part="env">
    <rect x="14" y="120" width="450" height="40" rx="4" fill="none" stroke="#f2b632" stroke-width="1" pointer-events="all" />
    <text x="55.2" y="135" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#f2b632">environment:</text>
    <text x="70.8" y="154" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#f2b632">DATABASE_URL: postgres://postgres@db:5432/reserve</text>
    <text x="480" y="146" font-size="14" fill="#f2b632">DB はサービス名 db で指す</text>
  </g>
  <g class="el" data-part="depends">
    <rect x="14" y="162" width="450" height="40" rx="4" fill="none" stroke="#9fb0c6" stroke-width="1" pointer-events="all" />
    <text x="55.2" y="177" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#9fb0c6">depends_on:</text>
    <text x="70.8" y="196" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#9fb0c6">- db</text>
    <text x="480" y="188" font-size="14" fill="#9fb0c6">db を先に動かす</text>
  </g>
  <g class="el" data-part="db">
    <rect x="14" y="204" width="450" height="40" rx="4" fill="none" stroke="#5cc1ff" stroke-width="1" pointer-events="all" />
    <text x="39.6" y="219" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#5cc1ff">db:</text>
    <text x="55.2" y="238" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#eef2f6">image: city-db:1.0</text>
    <text x="480" y="230" font-size="14" fill="#5cc1ff">もう 1 つのサービス</text>
  </g>
  <g class="el" data-part="volumes">
    <rect x="14" y="246" width="450" height="78" rx="4" fill="none" stroke="#3ae08a" stroke-width="1" pointer-events="all" />
    <text x="55.2" y="261" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#3ae08a">volumes:</text>
    <text x="70.8" y="280" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#3ae08a">- db-data:/var/lib/postgresql/data</text>
    <text x="24" y="299" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#3ae08a">volumes:</text>
    <text x="39.6" y="318" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#3ae08a">db-data:</text>
    <text x="480" y="280" font-size="14" fill="#3ae08a">データを残す場所</text>
    <text x="480" y="304" font-size="14" fill="#9fb0c6">（一番外で宣言する）</text>
  </g>
</svg>
