<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>証明書の連鎖。サーバの証明書の発行者が中間証明書、中間証明書の発行者がルート証明書。サーバは前の 2 枚を送り、ルートは端末が初めから持つ</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="leaf">
    <rect x="30" y="70" width="190" height="120" rx="10" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="125" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#5cc1ff">サーバの証明書</text>
    <text x="46" y="130" font-size="13" fill="#eef2f6">名前: shop.example</text>
    <text x="46" y="154" font-size="13" fill="#9fb0c6">発行者:</text>
    <text x="46" y="176" font-size="13" fill="#9fb0c6">Minato Issuing CA</text>
  </g>
  <g class="el" data-part="inter">
    <path d="M220 130 H266" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <rect x="270" y="70" width="190" height="120" rx="10" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="365" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#f2b632">中間証明書</text>
    <text x="286" y="130" font-size="13" fill="#eef2f6">名前: Minato Issuing CA</text>
    <text x="286" y="154" font-size="13" fill="#9fb0c6">発行者:</text>
    <text x="286" y="176" font-size="13" fill="#9fb0c6">Minato Root CA</text>
  </g>
  <g class="el" data-part="root">
    <path d="M460 130 H506" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <rect x="510" y="70" width="170" height="120" rx="10" fill="#3ae08a" />
    <text x="595" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#0a1424">ルート証明書</text>
    <text x="595" y="130" text-anchor="middle" font-size="13" fill="#0a1424">Minato Root CA</text>
    <text x="595" y="160" text-anchor="middle" font-size="13" fill="#0a1424">自分で自分を署名</text>
  </g>
  <g class="el" data-part="sent">
    <path d="M30 214 V226 H460 V214" fill="none" stroke="#9fb0c6" stroke-width="2" />
    <text x="245" y="252" text-anchor="middle" font-size="13" fill="#eef2f6">サーバが送る（この順に並べる）</text>
  </g>
  <g class="el" data-part="held">
    <path d="M510 214 V226 H680 V214" fill="none" stroke="#3ae08a" stroke-width="2" />
    <text x="595" y="252" text-anchor="middle" font-size="13" fill="#3ae08a">端末が初めから持つ</text>
  </g>
  <g class="el" data-part="caption">
    <text x="350" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">発行者をたどり、手元のルートに着けば信じる</text>
    <text x="350" y="300" text-anchor="middle" font-size="13" fill="#9fb0c6">中間が 1 枚欠けると、ルートまでたどれず警告になる</text>
  </g>
</svg>
