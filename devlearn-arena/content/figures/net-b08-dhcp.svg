<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>網につないだパソコンが「配ってくれる人はいるか」と全体に問い、DHCP のサーバが「192.168.1.100 はどう」と申し出て、パソコンが頼み、サーバが期限付きで貸すと認める 4 往復</title>
  <defs>
    <marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5cc1ff" />
    </marker>
    <marker id="d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3ae08a" />
    </marker>
  </defs>
  <g class="el" data-part="pc">
    <rect x="20" y="20" width="150" height="56" rx="10" fill="#5cc1ff" />
    <text x="95" y="54" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">新しいパソコン</text>
    <path d="M95 76 V306" fill="none" stroke="#5cc1ff" stroke-width="2" stroke-dasharray="4 4" />
  </g>
  <g class="el" data-part="server">
    <rect x="530" y="20" width="150" height="56" rx="10" fill="#3ae08a" />
    <text x="605" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="#0a1424">DHCP のサーバ</text>
    <text x="605" y="66" text-anchor="middle" font-size="13" fill="#0a1424">（ルータの中）</text>
    <path d="M605 76 V306" fill="none" stroke="#3ae08a" stroke-width="2" stroke-dasharray="4 4" />
  </g>
  <g class="el" data-part="discover">
    <path d="M95 112 H599" fill="none" stroke="#5cc1ff" stroke-width="2" marker-end="url(#d1)" />
    <text x="350" y="104" text-anchor="middle" font-size="14" fill="#eef2f6">1 探す: 配ってくれる人はいますか（全体へ）</text>
  </g>
  <g class="el" data-part="offer">
    <path d="M605 166 H101" fill="none" stroke="#3ae08a" stroke-width="2" marker-end="url(#d2)" />
    <text x="350" y="158" text-anchor="middle" font-size="14" fill="#eef2f6">2 申し出: 192.168.1.100 はどうですか</text>
  </g>
  <g class="el" data-part="request">
    <path d="M95 220 H599" fill="none" stroke="#5cc1ff" stroke-width="2" marker-end="url(#d1)" />
    <text x="350" y="212" text-anchor="middle" font-size="14" fill="#eef2f6">3 頼む: では 192.168.1.100 をください</text>
  </g>
  <g class="el" data-part="ack">
    <path d="M605 274 H101" fill="none" stroke="#3ae08a" stroke-width="2" marker-end="url(#d2)" />
    <text x="350" y="266" text-anchor="middle" font-size="14" fill="#eef2f6">4 認める: 24 時間貸します（リース）</text>
  </g>
  <g class="el" data-part="caption">
    <text x="350" y="308" text-anchor="middle" font-size="13" fill="#9fb0c6">配る範囲から、まだ誰にも貸していない番号を選んで貸す</text>
  </g>
</svg>
