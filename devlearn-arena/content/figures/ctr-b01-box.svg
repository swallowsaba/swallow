<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>コンテナの箱。アプリ・ライブラリ・設定を 1 つの箱（イメージ）に入れ、開発機・検証機・本番機で同じ箱を動かす。カーネルは箱に入れず、それぞれの機械の物を共有する</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="frame">
    <rect x="20" y="20" width="230" height="250" rx="10" fill="none" stroke="#f2b632" stroke-width="2" stroke-dasharray="8 5" />
    <text x="135" y="46" text-anchor="middle" font-size="16" fill="#f2b632">箱（イメージ）</text>
  </g>
  <g class="el" data-part="app">
    <rect x="40" y="64" width="190" height="52" rx="6" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="135" y="96" text-anchor="middle" font-size="14" fill="#eef2f6">アプリ 2.0</text>
  </g>
  <g class="el" data-part="lib">
    <rect x="40" y="128" width="190" height="52" rx="6" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="135" y="160" text-anchor="middle" font-size="14" fill="#eef2f6">ライブラリ date-lib 2.3</text>
  </g>
  <g class="el" data-part="conf">
    <rect x="40" y="192" width="190" height="52" rx="6" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="135" y="224" text-anchor="middle" font-size="14" fill="#eef2f6">設定</text>
  </g>
  <g class="el" data-part="machines">
    <path d="M254 145 H284" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <text x="269" y="132" text-anchor="middle" font-size="13" fill="#9fb0c6">配る</text>
    <rect x="292" y="40" width="124" height="200" rx="8" fill="none" stroke="#9fb0c6" stroke-width="2" pointer-events="all" />
    <text x="354" y="66" text-anchor="middle" font-size="14" fill="#eef2f6">開発機</text>
    <rect x="306" y="82" width="96" height="64" rx="4" fill="none" stroke="#f2b632" stroke-width="2" />
    <text x="354" y="120" text-anchor="middle" font-size="13" fill="#f2b632">同じ箱</text>
    <rect x="428" y="40" width="124" height="200" rx="8" fill="none" stroke="#9fb0c6" stroke-width="2" pointer-events="all" />
    <text x="490" y="66" text-anchor="middle" font-size="14" fill="#eef2f6">検証機</text>
    <rect x="442" y="82" width="96" height="64" rx="4" fill="none" stroke="#f2b632" stroke-width="2" />
    <text x="490" y="120" text-anchor="middle" font-size="13" fill="#f2b632">同じ箱</text>
    <rect x="564" y="40" width="124" height="200" rx="8" fill="none" stroke="#9fb0c6" stroke-width="2" pointer-events="all" />
    <text x="626" y="66" text-anchor="middle" font-size="14" fill="#eef2f6">本番機</text>
    <rect x="578" y="82" width="96" height="64" rx="4" fill="none" stroke="#f2b632" stroke-width="2" />
    <text x="626" y="120" text-anchor="middle" font-size="13" fill="#f2b632">同じ箱</text>
  </g>
  <g class="el" data-part="kernel">
    <rect x="306" y="166" width="96" height="52" rx="4" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="354" y="198" text-anchor="middle" font-size="13" fill="#3ae08a">カーネル</text>
    <rect x="442" y="166" width="96" height="52" rx="4" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="490" y="198" text-anchor="middle" font-size="13" fill="#3ae08a">カーネル</text>
    <rect x="578" y="166" width="96" height="52" rx="4" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="626" y="198" text-anchor="middle" font-size="13" fill="#3ae08a">カーネル</text>
  </g>
  <g class="el" data-part="note">
    <text x="20" y="310" font-size="14" fill="#eef2f6">箱に入れるのはアプリと動くのに要る物。カーネルは機械の物を共有する</text>
  </g>
</svg>
