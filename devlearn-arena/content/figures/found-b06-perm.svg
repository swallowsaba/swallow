<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>ls -l の先頭の 10 文字。1 文字目は種類、続く 3 文字ずつが所有者・グループ・その他の読み・書き・実行</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="type">
    <rect x="40" y="110" width="40" height="56" rx="8" fill="#9fb0c6" />
    <text x="60" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">-</text>
    <path d="M40 184 H80" stroke="#9fb0c6" stroke-width="3" />
    <text x="60" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">種類</text>
    <text x="60" y="232" text-anchor="middle" font-size="13" fill="#9fb0c6">- は普通の</text>
  </g>
  <g class="el" data-part="owner">
    <rect x="110" y="110" width="40" height="56" rx="8" fill="#f2b632" />
    <text x="130" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">r</text>
    <rect x="154" y="110" width="40" height="56" rx="8" fill="#f2b632" />
    <text x="174" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">w</text>
    <rect x="198" y="110" width="40" height="56" rx="8" fill="#f2b632" />
    <text x="218" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">-</text>
    <path d="M110 184 H238" stroke="#f2b632" stroke-width="3" />
    <text x="174" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">所有者</text>
    <text x="174" y="232" text-anchor="middle" font-size="13" fill="#9fb0c6">読む・書く</text>
  </g>
  <g class="el" data-part="group">
    <rect x="260" y="110" width="40" height="56" rx="8" fill="#5cc1ff" />
    <text x="280" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">r</text>
    <rect x="304" y="110" width="40" height="56" rx="8" fill="#5cc1ff" />
    <text x="324" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">-</text>
    <rect x="348" y="110" width="40" height="56" rx="8" fill="#5cc1ff" />
    <text x="368" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">-</text>
    <path d="M260 184 H388" stroke="#5cc1ff" stroke-width="3" />
    <text x="324" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">グループ</text>
    <text x="324" y="232" text-anchor="middle" font-size="13" fill="#9fb0c6">読むだけ</text>
  </g>
  <g class="el" data-part="other">
    <rect x="410" y="110" width="40" height="56" rx="8" fill="#9aa9b5" />
    <text x="430" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">r</text>
    <rect x="454" y="110" width="40" height="56" rx="8" fill="#9aa9b5" />
    <text x="474" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">-</text>
    <rect x="498" y="110" width="40" height="56" rx="8" fill="#9aa9b5" />
    <text x="518" y="148" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">-</text>
    <path d="M410 184 H538" stroke="#9aa9b5" stroke-width="3" />
