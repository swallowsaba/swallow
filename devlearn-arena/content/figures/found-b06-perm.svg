    <text x="320" y="300" text-anchor="middle" font-size="16" fill="#eef2f6">r = 読む　w = 書く　x = 実行する　- = できない</text>
    <text x="320" y="330" text-anchor="middle" font-size="13" fill="#9fb0c6">3 文字ずつ区切って読む</text>
  </g>
</svg>
