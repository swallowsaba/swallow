<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>-rwxr-x--- を 3 文字ずつ区切ると、所有者 rwx=7・グループ r-x=5・その他 ---=0 で、数字では 750</title>
  <g class="el" data-part="type">
    <rect x="34" y="62" width="54" height="230" fill="none" pointer-events="all" />
    <rect x="40" y="70" width="42" height="56" rx="8" fill="#9fb0c6" />
    <text x="61" y="108" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">-</text>
    <text x="61" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">種類</text>
  </g>
  <g class="el" data-part="owner">
    <rect x="110" y="62" width="150" height="230" fill="none" pointer-events="all" />
    <rect x="116" y="70" width="42" height="56" rx="8" fill="#f2b632" />
    <text x="137" y="108" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">r</text>
    <rect x="164" y="70" width="42" height="56" rx="8" fill="#f2b632" />
    <text x="185" y="108" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">w</text>
    <rect x="212" y="70" width="42" height="56" rx="8" fill="#f2b632" />
    <text x="233" y="108" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">x</text>
    <path d="M116 144 H254" stroke="#f2b632" stroke-width="3" />
    <text x="185" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">所有者</text>
    <text x="185" y="212" text-anchor="middle" font-size="13" fill="#9fb0c6">4+2+1</text>
    <text x="185" y="262" text-anchor="middle" font-size="36" font-weight="700" fill="#f2b632">7</text>
  </g>
  <g class="el" data-part="group">
    <rect x="284" y="62" width="150" height="230" fill="none" pointer-events="all" />
    <rect x="290" y="70" width="42" height="56" rx="8" fill="#5cc1ff" />
    <text x="311" y="108" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">r</text>
    <rect x="338" y="70" width="42" height="56" rx="8" fill="#9fb0c6" />
    <text x="359" y="108" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">-</text>
    <rect x="386" y="70" width="42" height="56" rx="8" fill="#5cc1ff" />
    <text x="407" y="108" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">x</text>
    <path d="M290 144 H428" stroke="#5cc1ff" stroke-width="3" />
    <text x="359" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">グループ</text>
    <text x="359" y="212" text-anchor="middle" font-size="13" fill="#9fb0c6">4+0+1</text>
    <text x="359" y="262" text-anchor="middle" font-size="36" font-weight="700" fill="#5cc1ff">5</text>
  </g>
  <g class="el" data-part="other">
    <rect x="458" y="62" width="150" height="230" fill="none" pointer-events="all" />
    <rect x="464" y="70" width="42" height="56" rx="8" fill="#9fb0c6" />
    <text x="485" y="108" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">-</text>
    <rect x="512" y="70" width="42" height="56" rx="8" fill="#9fb0c6" />
    <text x="533" y="108" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">-</text>
    <rect x="560" y="70" width="42" height="56" rx="8" fill="#9fb0c6" />
    <text x="581" y="108" text-anchor="middle" font-size="28" font-weight="700" fill="#0a1424">-</text>
    <path d="M464 144 H602" stroke="#9aa9b5" stroke-width="3" />
    <text x="533" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">その他</text>
    <text x="533" y="212" text-anchor="middle" font-size="13" fill="#9fb0c6">0+0+0</text>
    <text x="533" y="262" text-anchor="middle" font-size="36" font-weight="700" fill="#9aa9b5">0</text>
  </g>
  <g class="el" data-part="weights">
    <text x="350" y="36" text-anchor="middle" font-size="16" fill="#eef2f6">r（読む）=4　w（書く）=2　x（実行）=1 を、段ごとに足す</text>
  </g>
  <g class="el" data-part="number">
    <text x="640" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">数字で</text>
    <text x="640" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#3ae08a">750</text>
  </g>
</svg>
