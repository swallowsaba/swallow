<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>入力 → 処理 → 出力の流れと、処理の下に付いた記憶。4 つの箱で、コンピュータが何をしているかを表す</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="input">
    <rect x="30" y="90" width="150" height="80" rx="12" fill="#5cc1ff" />
    <text x="105" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#0a1424">入力</text>
    <text x="105" y="148" text-anchor="middle" font-size="13" fill="#0a1424">キーボード・マウス</text>
  </g>
  <g class="el" data-part="process">
    <rect x="245" y="90" width="150" height="80" rx="12" fill="#f2b632" />
    <text x="320" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#0a1424">処理</text>
    <text x="320" y="148" text-anchor="middle" font-size="13" fill="#0a1424">CPU が計算する</text>
  </g>
  <g class="el" data-part="output">
    <rect x="460" y="90" width="150" height="80" rx="12" fill="#3ae08a" />
    <text x="535" y="126" text-anchor="middle" font-size="18" font-weight="700" fill="#0a1424">出力</text>
    <text x="535" y="148" text-anchor="middle" font-size="13" fill="#0a1424">画面・スピーカー</text>
  </g>
  <g class="el" data-part="storage">
    <rect x="245" y="250" width="150" height="80" rx="12" fill="#9aa9b5" />
    <text x="320" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#0a1424">記憶</text>
    <text x="320" y="308" text-anchor="middle" font-size="13" fill="#0a1424">メモリ・ストレージ</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M180 130 H239" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M395 130 H454" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M305 170 V244" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M335 250 V176" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
    <text x="295" y="215" text-anchor="end" font-size="13" fill="#eef2f6">書く</text>
    <text x="345" y="215" text-anchor="start" font-size="13" fill="#eef2f6">読む</text>
    <text x="320" y="52" text-anchor="middle" font-size="14" font-weight="700" fill="#eef2f6">情報は左から右へ流れる</text>
  </g>
</svg>
