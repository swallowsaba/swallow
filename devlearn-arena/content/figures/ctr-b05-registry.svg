<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>レジストリ。作る機械がイメージを置き（push）、動かす機械たちが同じ名前で取ってくる（pull）。名前 registry.example/shop/web:1.2 は、レジストリの場所・イメージの名前・タグに分かれる</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="build">
    <rect x="20" y="40" width="150" height="60" rx="8" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="95" y="76" text-anchor="middle" font-size="14" fill="#eef2f6">作る機械</text>
  </g>
  <g class="el" data-part="store">
    <path d="M174 70 H240" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <text x="207" y="60" text-anchor="middle" font-size="13" fill="#9fb0c6">push</text>
    <rect x="246" y="30" width="200" height="80" rx="8" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="346" y="64" text-anchor="middle" font-size="16" fill="#f2b632">レジストリ</text>
    <text x="346" y="90" text-anchor="middle" font-size="13" fill="#9fb0c6">イメージの置き場</text>
  </g>
  <g class="el" data-part="run">
    <path d="M450 60 L524 44 M450 70 H524 M450 80 L524 96" fill="none" stroke="#9fb0c6" stroke-width="2" />
    <text x="487" y="30" text-anchor="middle" font-size="13" fill="#9fb0c6">pull</text>
    <rect x="530" y="24" width="150" height="36" rx="6" fill="none" stroke="#3ae08a" stroke-width="2" />
    <text x="605" y="48" text-anchor="middle" font-size="13" fill="#eef2f6">本番のサーバ 1</text>
    <rect x="530" y="66" width="150" height="36" rx="6" fill="none" stroke="#3ae08a" stroke-width="2" />
    <text x="605" y="90" text-anchor="middle" font-size="13" fill="#eef2f6">本番のサーバ 2</text>
  </g>
  <g class="el" data-part="host">
    <text x="182" y="200" text-anchor="middle" font-size="22" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#f2b632">registry.example/</text>
    <rect x="66" y="172" width="232" height="40" rx="4" fill="none" stroke="#f2b632" stroke-width="1" pointer-events="all" />
    <text x="182" y="240" text-anchor="middle" font-size="13" fill="#f2b632">レジストリの場所</text>
  </g>
  <g class="el" data-part="name">
    <text x="384" y="200" text-anchor="middle" font-size="22" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#5cc1ff">shop/web</text>
    <rect x="310" y="172" width="148" height="40" rx="4" fill="none" stroke="#5cc1ff" stroke-width="1" pointer-events="all" />
    <text x="384" y="240" text-anchor="middle" font-size="13" fill="#5cc1ff">イメージの名前</text>
  </g>
  <g class="el" data-part="tag">
    <text x="520" y="200" text-anchor="middle" font-size="22" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#3ae08a">:1.2</text>
    <rect x="470" y="172" width="100" height="40" rx="4" fill="none" stroke="#3ae08a" stroke-width="1" pointer-events="all" />
    <text x="520" y="240" text-anchor="middle" font-size="13" fill="#3ae08a">タグ（版の名札）</text>
  </g>
  <g class="el" data-part="note">
    <text x="20" y="300" font-size="14" fill="#9fb0c6">タグを省くと latest という名札の物を取る。最新の安定版とは限らない</text>
  </g>
</svg>
