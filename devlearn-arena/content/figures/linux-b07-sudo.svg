<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>一般の利用者は sudo を付けた 1 つの命令だけ管理者（root）として実行し、終われば戻る。共有の場所は web グループに入った人が書ける</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="user">
    <rect x="30" y="40" width="170" height="90" rx="12" fill="#3ae08a" />
    <text x="115" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">一般の利用者</text>
    <text x="115" y="104" text-anchor="middle" font-size="14" fill="#0a1424">learner（普段）</text>
  </g>
  <g class="el" data-part="sudo">
    <path d="M200 70 H476" fill="none" stroke="#f2b632" stroke-width="3" marker-end="url(#arrow-gold)" />
    <text x="338" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#f2b632">sudo ＋ 命令 1 つ</text>
    <path d="M480 108 H204" fill="none" stroke="#9fb0c6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" />
    <text x="338" y="130" text-anchor="middle" font-size="13" fill="#9fb0c6">終われば普段に戻る</text>
  </g>
  <g class="el" data-part="root">
    <rect x="482" y="40" width="190" height="90" rx="12" fill="#f2b632" />
    <text x="577" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">管理者（root）</text>
    <text x="577" y="104" text-anchor="middle" font-size="14" fill="#0a1424">何でもできる</text>
  </g>
  <g class="el" data-part="group">
    <rect x="30" y="200" width="300" height="110" rx="12" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="50" y="228" font-size="16" font-weight="700" fill="#5cc1ff">web グループ</text>
    <rect x="50" y="248" width="120" height="44" rx="8" fill="#5cc1ff" />
    <text x="110" y="276" text-anchor="middle" font-size="14" fill="#0a1424">learner</text>
    <rect x="190" y="248" width="120" height="44" rx="8" fill="#5cc1ff" />
    <text x="250" y="276" text-anchor="middle" font-size="14" fill="#0a1424">チームの人</text>
  </g>
  <g class="el" data-part="share">
    <path d="M330 255 H446" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
    <text x="388" y="242" text-anchor="middle" font-size="13" fill="#9fb0c6">書ける</text>
    <rect x="452" y="210" width="220" height="90" rx="12" fill="#9aa9b5" />
    <text x="562" y="248" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">/srv/web</text>
    <text x="562" y="274" text-anchor="middle" font-size="14" fill="#0a1424">グループの段 rwx</text>
  </g>
</svg>
