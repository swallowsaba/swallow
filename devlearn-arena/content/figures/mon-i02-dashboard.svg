<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>上の段に利用者の指標、中の段に資源、下の段に依存先を並べ、同じ時刻で見比べる</title>
  <g class="el" data-part="user">
    <rect x="20" y="30" width="600" height="80" rx="10" fill="#1a6fd6" />
    <text x="320" y="64" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">利用者の指標</text>
    <text x="320" y="86" text-anchor="middle" font-size="14" fill="#eef2f6">エラーの割合・応答時間（症状）</text>
  </g>
  <g class="el" data-part="resource">
    <rect x="20" y="125" width="600" height="80" rx="10" fill="#7a3fd0" />
    <text x="320" y="159" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">資源</text>
    <text x="320" y="181" text-anchor="middle" font-size="14" fill="#eef2f6">CPU・メモリ・ディスク</text>
  </g>
  <g class="el" data-part="dep">
    <rect x="20" y="220" width="600" height="80" rx="10" fill="#1f7a4d" />
    <text x="320" y="254" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">依存先</text>
    <text x="320" y="276" text-anchor="middle" font-size="14" fill="#eef2f6">DB・外部の API（原因候補）</text>
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">症状から原因へ、上から下に読む</text>
  </g>
</svg>
