<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>秘密はコードに書かない。鍵の値は環境変数や秘密の保管場所に置き、コードからは名前（WEATHER_TOKEN）で参照する。リポジトリに入るのはコードだけ</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="bad">
    <rect x="20" y="24" width="300" height="96" rx="10" fill="none" stroke="#c0392b" stroke-width="2" pointer-events="all" />
    <text x="40" y="54" font-size="14" fill="#c0392b">よくない: コードに値を書く</text>
    <text x="40" y="84" font-size="14" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#eef2f6">TOKEN=wt_live_9fK2…</text>
    <text x="40" y="108" font-size="13" fill="#9fb0c6">コミットすると、履歴に残る</text>
  </g>
  <g class="el" data-part="code">
    <rect x="20" y="168" width="300" height="96" rx="10" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="40" y="198" font-size="14" fill="#3ae08a">よい: コードには名前だけ</text>
    <text x="40" y="228" font-size="14" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#eef2f6">TOKEN=$WEATHER_TOKEN</text>
    <text x="40" y="252" font-size="13" fill="#9fb0c6">リポジトリに入るのはこちら</text>
  </g>
  <g class="el" data-part="store">
    <rect x="420" y="140" width="260" height="152" rx="10" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="440" y="172" font-size="14" fill="#f2b632">値の置き場所（リポジトリの外）</text>
    <text x="440" y="204" font-size="14" fill="#eef2f6">環境変数</text>
    <text x="440" y="230" font-size="14" fill="#eef2f6">.env（.gitignore で外す）</text>
    <text x="440" y="256" font-size="14" fill="#eef2f6">秘密の保管場所</text>
    <text x="440" y="280" font-size="13" fill="#9fb0c6">動かす時にだけ渡す</text>
  </g>
  <g class="el" data-part="link">
    <path d="M414 216 H326" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <text x="370" y="206" text-anchor="middle" font-size="13" fill="#9fb0c6">名前で読む</text>
  </g>
  <g class="el" data-part="note">
    <text x="550" y="60" text-anchor="middle" font-size="14" fill="#eef2f6">漏れたら、消す前に</text>
    <text x="550" y="86" text-anchor="middle" font-size="14" fill="#eef2f6">まず鍵を無効にする</text>
  </g>
</svg>
