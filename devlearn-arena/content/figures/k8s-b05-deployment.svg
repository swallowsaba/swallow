<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>Deployment の中に ReplicaSet、ReplicaSet の中に Pod。Deployment は「web を 3 つ」と宣言し、ReplicaSet が Pod の数を合わせる。Pod が 1 つ消えると、あるべき 3 と今の 2 を比べ、足りない 1 つを別の名前で作り直す</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="deployment">
    <rect x="16" y="16" width="440" height="298" rx="12" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="36" y="44" font-size="16" fill="#f2b632">Deployment（web）</text>
    <text x="436" y="44" text-anchor="end" font-size="14" fill="#eef2f6">あるべき数: 3</text>
  </g>
  <rect x="36" y="62" width="400" height="232" rx="10" fill="none" stroke="#5cc1ff" stroke-width="2" />
  <g class="el" data-part="replicaset">
    <rect x="44" y="68" width="384" height="34" rx="6" fill="none" stroke="#5cc1ff" stroke-width="1" stroke-dasharray="2 4" pointer-events="all" />
    <text x="56" y="91" font-size="14" fill="#5cc1ff">ReplicaSet（数を合わせる係）</text>
  </g>
  <g class="el" data-part="pod1">
    <rect x="56" y="110" width="110" height="80" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="111" y="146" text-anchor="middle" font-size="14" fill="#3ae08a">Pod</text>
    <text x="111" y="172" text-anchor="middle" font-size="13" fill="#9fb0c6">動いている</text>
  </g>
  <g class="el" data-part="pod2">
    <rect x="181" y="110" width="110" height="80" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="236" y="146" text-anchor="middle" font-size="14" fill="#3ae08a">Pod</text>
    <text x="236" y="172" text-anchor="middle" font-size="13" fill="#9fb0c6">動いている</text>
  </g>
  <g class="el" data-part="gone">
    <rect x="306" y="110" width="110" height="80" rx="8" fill="none" stroke="#9fb0c6" stroke-width="2" stroke-dasharray="6 4" pointer-events="all" />
    <text x="361" y="146" text-anchor="middle" font-size="14" fill="#9fb0c6">Pod</text>
    <text x="361" y="172" text-anchor="middle" font-size="13" fill="#9fb0c6">消えた</text>
    <rect x="306" y="214" width="110" height="64" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="361" y="244" text-anchor="middle" font-size="14" fill="#3ae08a">新しい Pod</text>
    <text x="361" y="266" text-anchor="middle" font-size="13" fill="#9fb0c6">別の名前</text>
  </g>
  <line x1="361" y1="192" x2="361" y2="210" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <g class="el" data-part="compare">
    <rect x="484" y="62" width="200" height="232" rx="10" fill="none" stroke="#9fb0c6" stroke-width="2" pointer-events="all" />
    <text x="584" y="96" text-anchor="middle" font-size="14" fill="#eef2f6">比べて差を埋める</text>
    <text x="584" y="136" text-anchor="middle" font-size="16" fill="#f2b632">あるべき 3</text>
    <text x="584" y="170" text-anchor="middle" font-size="16" fill="#9fb0c6">今 2</text>
    <text x="584" y="210" text-anchor="middle" font-size="13" fill="#9fb0c6">足りない 1 つを</text>
    <text x="584" y="234" text-anchor="middle" font-size="13" fill="#9fb0c6">作り直す</text>
    <text x="584" y="270" text-anchor="middle" font-size="16" fill="#3ae08a">今 3 に戻る</text>
  </g>
</svg>
