<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>同じイメージを、複数の道具で作り・動かす</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="image">
    <rect x="20" y="120" width="180" height="110" rx="10" fill="#f2b632" />
    <text x="110" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">同じイメージ</text>
    <text x="110" y="191" text-anchor="middle" font-size="14" fill="#0a1424">OCI の標準</text>
  </g>
  <g class="el" data-part="docker">
    <rect x="260" y="40" width="360" height="80" rx="10" fill="#1a6fd6" />
    <text x="440" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">Docker</text>
    <text x="440" y="96" text-anchor="middle" font-size="14" fill="#eef2f6">本体が常駐して動かす</text>
  </g>
  <g class="el" data-part="podman">
    <rect x="260" y="135" width="360" height="80" rx="10" fill="#7a3fd0" />
    <text x="440" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">Podman</text>
    <text x="440" y="191" text-anchor="middle" font-size="14" fill="#eef2f6">本体なし。利用者の権限で動かす</text>
  </g>
  <g class="el" data-part="k8s">
    <rect x="260" y="230" width="360" height="80" rx="10" fill="#1f7a4d" />
    <text x="440" y="264" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">Kubernetes（containerd）</text>
    <text x="440" y="286" text-anchor="middle" font-size="14" fill="#eef2f6">クラスタの中で動かす</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M200 160 L257 80" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M200 175 L257 175" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M200 190 L257 270" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">Docker は道具の 1 つ</text>
  </g>
</svg>
