<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>中のパソコン 192.168.1.10 が外へ出る時、ルータが送り元を外向きの 203.0.113.5 に付け替え、対応を表に覚える。返事は表を見て中のパソコンへ戻す</title>
  <defs>
    <marker id="n1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5cc1ff" />
    </marker>
    <marker id="n2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3ae08a" />
    </marker>
  </defs>
  <g class="el" data-part="inside">
    <rect x="16" y="40" width="190" height="200" rx="14" fill="none" stroke="#3ae08a" stroke-width="2" stroke-dasharray="7 5" pointer-events="all" />
    <text x="111" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#3ae08a">中の網（プライベート）</text>
    <rect x="46" y="110" width="130" height="60" rx="10" fill="#3ae08a" />
    <text x="111" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#0a1424">パソコン</text>
    <text x="111" y="158" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="13" fill="#0a1424">192.168.1.10</text>
  </g>
  <g class="el" data-part="router">
    <rect x="262" y="100" width="150" height="80" rx="12" fill="#f2b632" />
    <text x="337" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">ルータ（NAT）</text>
    <text x="337" y="156" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="13" fill="#0a1424">外 203.0.113.5</text>
  </g>
  <g class="el" data-part="outside">
    <rect x="510" y="110" width="170" height="60" rx="10" fill="#9aa9b5" />
    <text x="595" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#0a1424">外のサーバ</text>
    <text x="595" y="158" text-anchor="middle" font-size="13" fill="#0a1424">インターネットの先</text>
  </g>
  <g class="el" data-part="go">
    <path d="M176 122 H256" fill="none" stroke="#5cc1ff" stroke-width="2" marker-end="url(#n1)" />
    <path d="M412 122 H504" fill="none" stroke="#5cc1ff" stroke-width="2" marker-end="url(#n1)" />
    <text x="214" y="96" font-size="13" fill="#5cc1ff">送り元 .10</text>
    <text x="460" y="96" text-anchor="middle" font-size="13" fill="#5cc1ff">送り元 203.0.113.5</text>
  </g>
  <g class="el" data-part="back">
    <path d="M510 158 H418" fill="none" stroke="#3ae08a" stroke-width="2" marker-end="url(#n2)" />
    <path d="M262 158 H182" fill="none" stroke="#3ae08a" stroke-width="2" marker-end="url(#n2)" />
    <text x="337" y="206" text-anchor="middle" font-size="13" fill="#3ae08a">返事は、覚えた対応で中へ戻す</text>
  </g>
  <g class="el" data-part="table">
    <rect x="232" y="224" width="210" height="56" rx="8" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="337" y="246" text-anchor="middle" font-size="13" fill="#f2b632">変換の表</text>
    <text x="337" y="268" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="13" fill="#eef2f6">.10:51000 ⇔ :40001</text>
  </g>
</svg>
