<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>パソコン → 家のルータ → プロバイダ → インターネット → サーバ、とデータが順に通る</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="pc">
    <rect x="20" y="110" width="110" height="80" rx="12" fill="#5cc1ff" />
    <text x="75" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">パソコン</text>
    <text x="75" y="168" text-anchor="middle" font-size="13" fill="#0a1424">家の中</text>
  </g>
  <g class="el" data-part="router">
    <rect x="160" y="110" width="110" height="80" rx="12" fill="#5cc1ff" />
    <text x="215" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">ルータ</text>
    <text x="215" y="168" text-anchor="middle" font-size="13" fill="#0a1424">家の出入口</text>
  </g>
  <g class="el" data-part="isp">
    <rect x="300" y="110" width="110" height="80" rx="12" fill="#9aa9b5" />
    <text x="355" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">プロバイダ</text>
    <text x="355" y="168" text-anchor="middle" font-size="13" fill="#0a1424">接続の会社</text>
  </g>
  <g class="el" data-part="internet">
    <rect x="440" y="110" width="110" height="80" rx="12" fill="#9aa9b5" />
    <text x="495" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#0a1424">インターネット</text>
    <text x="495" y="168" text-anchor="middle" font-size="13" fill="#0a1424">網の網</text>
  </g>
  <g class="el" data-part="server">
    <rect x="580" y="110" width="110" height="80" rx="12" fill="#3ae08a" />
    <text x="635" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">サーバ</text>
    <text x="635" y="168" text-anchor="middle" font-size="13" fill="#0a1424">サービスを出す</text>
  </g>
  <g class="el" data-part="lan">
    <rect x="10" y="80" width="270" height="140" rx="12" fill="none" stroke="#f2b632" stroke-width="2" stroke-dasharray="6 5" pointer-events="all" />
    <text x="145" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#f2b632">家の中のネットワーク（LAN）</text>
    <path d="M130 150 H154" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M270 150 H294" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M410 150 H434" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M550 150 H574" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
    <text x="490" y="260" text-anchor="middle" font-size="13" fill="#eef2f6">データは機器を順に通って届く</text>
  </g>
</svg>
