<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>依頼 GET /about.html を Web サーバが受け、公開用のディレクトリ /var/www/html の about.html を返す。ディレクトリの外のファイルは見えない</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3ae08a" />
    </marker>
  </defs>
  <g class="el" data-part="request">
    <rect x="20" y="50" width="170" height="56" rx="10" fill="#5cc1ff" />
    <text x="105" y="84" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" fill="#0a1424">GET /about.html</text>
    <path d="M190 78 H244" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  </g>
  <g class="el" data-part="server">
    <rect x="250" y="40" width="160" height="76" rx="12" fill="#7a3fd0" />
    <text x="330" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">Web サーバ</text>
    <text x="330" y="96" text-anchor="middle" font-size="13" fill="#eef2f6">依頼を待ち続ける</text>
  </g>
  <g class="el" data-part="docroot">
    <rect x="250" y="150" width="250" height="120" rx="10" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="266" y="176" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" fill="#f2b632">/var/www/html/</text>
    <text x="282" y="202" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" fill="#eef2f6">index.html</text>
    <text x="282" y="226" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" font-weight="700" fill="#3ae08a">about.html</text>
    <text x="282" y="250" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" fill="#eef2f6">img/logo.png</text>
  </g>
  <g class="el" data-part="mapping">
    <path d="M330 116 V144" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <text x="342" y="136" font-size="13" fill="#9fb0c6">パスを当てる</text>
  </g>
  <g class="el" data-part="response">
    <path d="M410 78 H514" fill="none" stroke="#3ae08a" stroke-width="2" marker-end="url(#ag)" />
    <rect x="520" y="50" width="160" height="56" rx="10" fill="#3ae08a" />
    <text x="600" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#0a1424">200 と about.html</text>
  </g>
  <g class="el" data-part="outside">
    <rect x="530" y="170" width="150" height="70" rx="10" fill="none" stroke="#e04a3a" stroke-width="2" stroke-dasharray="6 4" pointer-events="all" />
    <text x="605" y="198" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="13" fill="#eef2f6">/root/memo.txt</text>
    <text x="605" y="222" text-anchor="middle" font-size="13" fill="#e04a3a">外は見えない</text>
  </g>
  <g class="el" data-part="caption">
    <text x="20" y="300" font-size="13" fill="#9fb0c6">公開用のディレクトリ（設定の root）の中だけが、URL で見える</text>
  </g>
</svg>
