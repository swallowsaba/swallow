<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>認証と認可。入口で身分証を見て誰かを確かめ（認証）、その人の役割に合う部屋の鍵だけを渡す（認可）</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="person">
    <circle cx="70" cy="120" r="22" fill="none" stroke="#eef2f6" stroke-width="2" />
    <path d="M38 196 C38 160 102 160 102 196 Z" fill="none" stroke="#eef2f6" stroke-width="2" />
    <text x="70" y="228" text-anchor="middle" font-size="14" fill="#eef2f6">来た人</text>
    <text x="70" y="250" text-anchor="middle" font-size="13" fill="#9fb0c6">窓口係の佐藤</text>
  </g>
  <g class="el" data-part="authn">
    <path d="M110 160 H176" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <rect x="182" y="70" width="190" height="180" rx="10" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="277" y="104" text-anchor="middle" font-size="18" fill="#5cc1ff">認証</text>
    <text x="277" y="134" text-anchor="middle" font-size="14" fill="#eef2f6">入口で身分証を見る</text>
    <text x="277" y="170" text-anchor="middle" font-size="14" fill="#eef2f6">「誰か」を確かめる</text>
    <text x="277" y="214" text-anchor="middle" font-size="13" fill="#9fb0c6">違えば 401（誰か分からない）</text>
  </g>
  <g class="el" data-part="authz">
    <path d="M372 160 H418" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <rect x="424" y="70" width="256" height="180" rx="10" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="552" y="104" text-anchor="middle" font-size="18" fill="#f2b632">認可</text>
    <text x="552" y="134" text-anchor="middle" font-size="14" fill="#eef2f6">役割に合う部屋の鍵だけ渡す</text>
    <text x="552" y="170" text-anchor="middle" font-size="14" fill="#eef2f6">「何をしてよいか」を決める</text>
    <text x="552" y="214" text-anchor="middle" font-size="13" fill="#9fb0c6">鍵の無い部屋は 403（してはいけない）</text>
  </g>
  <g class="el" data-part="note">
    <text x="350" y="300" text-anchor="middle" font-size="14" fill="#eef2f6">本人だと分かっても、何でもしてよいわけではない</text>
  </g>
</svg>
