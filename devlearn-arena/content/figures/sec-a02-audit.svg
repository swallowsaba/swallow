<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>認証・操作・変更の 3 つの記録を、時刻でつなぐ</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="auth">
    <rect x="20" y="110" width="184" height="130" rx="10" fill="#1a6fd6" />
    <text x="112" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">認証の記録</text>
    <text x="112" y="191" text-anchor="middle" font-size="14" fill="#eef2f6">誰がどこから</text>
  </g>
  <g class="el" data-part="op">
    <rect x="228" y="110" width="184" height="130" rx="10" fill="#7a3fd0" />
    <text x="320" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">操作の記録</text>
    <text x="320" y="191" text-anchor="middle" font-size="14" fill="#eef2f6">何を打ったか</text>
  </g>
  <g class="el" data-part="change">
    <rect x="436" y="110" width="184" height="130" rx="10" fill="#f2b632" />
    <text x="528" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">変更の記録</text>
    <text x="528" y="191" text-anchor="middle" font-size="14" fill="#0a1424">何が変わったか</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M204 175 L225 175" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M412 175 L433 175" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">誰が・いつ・何を・どこから。記録は別の場所へも送る</text>
  </g>
</svg>
