<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>Secret は秘密の値を Pod に渡す。保存は base64 の符号にすぎず、読めれば誰でも元に戻せる。だから、見られる人を権限で絞る</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="secret">
    <rect x="12" y="24" width="240" height="140" rx="8" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="132" y="54" text-anchor="middle" font-size="16" fill="#f2b632">Secret（db-secret）</text>
    <text x="132" y="80" text-anchor="middle" font-size="13" fill="#9fb0c6">保存は base64 の符号</text>
    <text x="28" y="114" font-size="13" fill="#eef2f6" font-family="&quot;JetBrains Mono&quot;, monospace">password:</text>
    <text x="36" y="138" font-size="13" fill="#eef2f6" font-family="&quot;JetBrains Mono&quot;, monospace">UmVzZXJ2ZS1QYXNzLTIwMjY=</text>
  </g>
  <g class="el" data-part="pod">
    <rect x="470" y="24" width="218" height="140" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="579" y="56" text-anchor="middle" font-size="16" fill="#3ae08a">Pod（db）</text>
    <text x="579" y="96" text-anchor="middle" font-size="13" fill="#eef2f6" font-family="&quot;JetBrains Mono&quot;, monospace">POSTGRES_PASSWORD</text>
    <text x="579" y="122" text-anchor="middle" font-size="13" fill="#9fb0c6">元の値で受け取る</text>
  </g>
  <g class="el" data-part="decode">
    <rect x="12" y="206" width="240" height="110" rx="8" fill="none" stroke="#ff8a7a" stroke-width="2" stroke-dasharray="6 4" pointer-events="all" />
    <text x="132" y="236" text-anchor="middle" font-size="14" fill="#ff8a7a">読めれば、誰でも戻せる</text>
    <text x="132" y="264" text-anchor="middle" font-size="13" fill="#9fb0c6">鍵は要らない</text>
    <text x="132" y="292" text-anchor="middle" font-size="13" fill="#eef2f6" font-family="&quot;JetBrains Mono&quot;, monospace">Reserve-Pass-2026</text>
  </g>
  <g class="el" data-part="permission">
    <rect x="300" y="206" width="388" height="110" rx="8" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="494" y="236" text-anchor="middle" font-size="14" fill="#5cc1ff">権限で、見られる人を絞る</text>
    <text x="320" y="268" font-size="13" fill="#eef2f6">DB の係</text>
    <text x="440" y="268" font-size="13" fill="#3ae08a">Secret を読める</text>
    <text x="320" y="296" font-size="13" fill="#eef2f6">ほかの人</text>
    <text x="440" y="296" font-size="13" fill="#9fb0c6">読めない</text>
  </g>
  <line x1="254" y1="94" x2="466" y2="94" stroke="#3ae08a" stroke-width="2" marker-end="url(#ar)" />
  <text x="360" y="84" text-anchor="middle" font-size="13" fill="#9fb0c6">値を渡す</text>
  <line x1="132" y1="166" x2="132" y2="202" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <text x="142" y="190" font-size="13" fill="#9fb0c6">base64 を戻す</text>
</svg>
