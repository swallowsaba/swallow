<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>役割（指揮・調査・連絡）と情報の流れ</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="lead">
    <rect x="20" y="40" width="180" height="110" rx="10" fill="#f2b632" />
    <text x="110" y="89" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">指揮</text>
    <text x="110" y="111" text-anchor="middle" font-size="14" fill="#0a1424">決めて割り振る</text>
  </g>
  <g class="el" data-part="dig">
    <rect x="230" y="40" width="180" height="110" rx="10" fill="#1a6fd6" />
    <text x="320" y="89" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">調査</text>
    <text x="320" y="111" text-anchor="middle" font-size="14" fill="#eef2f6">原因を探して直す</text>
  </g>
  <g class="el" data-part="talk">
    <rect x="440" y="40" width="180" height="110" rx="10" fill="#7a3fd0" />
    <text x="530" y="89" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">連絡</text>
    <text x="530" y="111" text-anchor="middle" font-size="14" fill="#eef2f6">外へ状況を伝える</text>
  </g>
  <g class="el" data-part="log">
    <rect x="20" y="200" width="600" height="90" rx="10" fill="#1f7a4d" />
    <text x="320" y="239" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">共有の記録</text>
    <text x="320" y="261" text-anchor="middle" font-size="14" fill="#eef2f6">時刻と決めた事を残し、誰でも読める</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M110 150 L110 197" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M320 150 L320 197" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M530 150 L530 197" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">道具だけでは回らない。仕組みと文化を作る</text>
  </g>
</svg>
