<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>1 つの網に全員がいると、来客からも社内のサーバが見える。社内・サーバ・来客の 3 つの網（VLAN）に分けると、網の間はルータとファイアウォールを通り、規則で許した通信だけが通る</title>
  <g class="el" data-part="flat">
    <rect x="16" y="50" width="190" height="200" rx="14" fill="none" stroke="#e04a3a" stroke-width="2" stroke-dasharray="7 5" />
    <text x="111" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#e04a3a">分けない（1 つの網）</text>
    <text x="111" y="100" text-anchor="middle" font-size="14" fill="#eef2f6">社員のパソコン</text>
    <text x="111" y="140" text-anchor="middle" font-size="14" fill="#eef2f6">ファイルサーバ</text>
    <text x="111" y="180" text-anchor="middle" font-size="14" fill="#eef2f6">来客のスマホ</text>
    <text x="111" y="226" text-anchor="middle" font-size="13" fill="#e04a3a">来客からも全て見える</text>
  </g>
  <g class="el" data-part="office">
    <rect x="260" y="30" width="170" height="70" rx="10" fill="none" stroke="#5cc1ff" stroke-width="2" />
    <text x="345" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#5cc1ff">社内（VLAN 10）</text>
    <text x="345" y="82" text-anchor="middle" font-size="13" fill="#eef2f6">社員のパソコン</text>
  </g>
  <g class="el" data-part="servers">
    <rect x="260" y="115" width="170" height="70" rx="10" fill="none" stroke="#3ae08a" stroke-width="2" />
    <text x="345" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#3ae08a">サーバ（VLAN 20）</text>
    <text x="345" y="167" text-anchor="middle" font-size="13" fill="#eef2f6">ファイルサーバ</text>
  </g>
  <g class="el" data-part="guest">
    <rect x="260" y="200" width="170" height="70" rx="10" fill="none" stroke="#f2b632" stroke-width="2" />
    <text x="345" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#f2b632">来客（VLAN 30）</text>
    <text x="345" y="252" text-anchor="middle" font-size="13" fill="#eef2f6">来客のスマホ</text>
  </g>
  <g class="el" data-part="fw">
    <rect x="510" y="100" width="170" height="100" rx="12" fill="#f2b632" />
    <text x="595" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#0a1424">ルータ</text>
    <text x="595" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#0a1424">＋ファイアウォール</text>
    <text x="595" y="182" text-anchor="middle" font-size="13" fill="#0a1424">網の間の規則</text>
    <path d="M430 65 L510 120 M430 150 H510 M430 235 L510 180" fill="none" stroke="#9fb0c6" stroke-width="2" />
  </g>
  <g class="el" data-part="caption">
    <text x="595" y="240" text-anchor="middle" font-size="13" fill="#e04a3a">来客 → 社内・サーバ: 止める</text>
    <text x="595" y="262" text-anchor="middle" font-size="13" fill="#3ae08a">社内 → サーバ: 通す</text>
  </g>
</svg>
