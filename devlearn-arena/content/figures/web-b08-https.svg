<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>http では途中で中身が読めるが、https では包まれて読めない。http で来た依頼は 301 で https へ移す。https のページの中の http の画像は混在コンテンツ</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="plain">
    <text x="20" y="44" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" font-weight="700" fill="#e04a3a">http://</text>
    <rect x="110" y="24" width="420" height="32" rx="16" fill="none" stroke="#e04a3a" stroke-width="2" />
    <text x="320" y="46" text-anchor="middle" font-size="14" fill="#eef2f6">パスワード: minato123（途中で読める）</text>
  </g>
  <g class="el" data-part="secure">
    <text x="20" y="108" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" font-weight="700" fill="#3ae08a">https://</text>
    <rect x="110" y="88" width="420" height="32" rx="16" fill="#3ae08a" />
    <text x="320" y="110" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" fill="#0a1424">17 03 03 9f c2 …（TLS で包まれて読めない）</text>
  </g>
  <g class="el" data-part="port">
    <text x="548" y="46" font-size="13" fill="#9fb0c6">80 番</text>
    <text x="548" y="110" font-size="13" fill="#9fb0c6">443 番</text>
  </g>
  <g class="el" data-part="redirect">
    <rect x="20" y="160" width="190" height="44" rx="8" fill="none" stroke="#9fb0c6" stroke-width="2" />
    <text x="115" y="187" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="13" fill="#eef2f6">http://city.example/</text>
    <path d="M210 182 H300" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <text x="255" y="174" text-anchor="middle" font-size="13" fill="#f2b632">301</text>
    <rect x="306" y="160" width="200" height="44" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" />
    <text x="406" y="187" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="13" fill="#3ae08a">https://city.example/</text>
  </g>
  <g class="el" data-part="mixed">
    <rect x="20" y="230" width="486" height="70" rx="10" fill="none" stroke="#f2b632" stroke-width="2" />
    <text x="36" y="256" font-size="13" fill="#eef2f6">https のページ</text>
    <text x="36" y="284" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="13" fill="#f2b632">&lt;img src="http://city.example/logo.png"&gt;</text>
  </g>
  <g class="el" data-part="caption">
    <text x="530" y="256" font-size="13" fill="#f2b632">部品が http だと</text>
    <text x="530" y="278" font-size="13" fill="#f2b632">鍵の印に警告</text>
  </g>
</svg>
