<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>通知から影響と時刻を確かめ、その頃の変更を見て、材料を突き合わせ、仮説を確かめる</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="impact">
    <rect x="20" y="40" width="180" height="90" rx="10" fill="#1a6fd6" />
    <text x="110" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">影響と時刻</text>
    <text x="110" y="101" text-anchor="middle" font-size="14" fill="#eef2f6">誰が・いつから</text>
  </g>
  <g class="el" data-part="change">
    <rect x="230" y="40" width="180" height="90" rx="10" fill="#f2b632" />
    <text x="320" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">その頃の変更</text>
    <text x="320" y="101" text-anchor="middle" font-size="14" fill="#0a1424">配布・設定</text>
  </g>
  <g class="el" data-part="evidence">
    <rect x="440" y="40" width="180" height="90" rx="10" fill="#7a3fd0" />
    <text x="530" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">材料の突き合わせ</text>
    <text x="530" y="101" text-anchor="middle" font-size="14" fill="#eef2f6">ログ・指標・トレース</text>
  </g>
  <g class="el" data-part="hypothesis">
    <rect x="130" y="190" width="380" height="90" rx="10" fill="#1f7a4d" />
    <text x="320" y="229" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">仮説を確かめる</text>
    <text x="320" y="251" text-anchor="middle" font-size="14" fill="#eef2f6">影響の少ない方法で（戻すなど）</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M200 85 L226 85" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M410 85 L436 85" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M530 130 L440 186" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">「直前に何が変わったか」が一番の手掛かり</text>
  </g>
</svg>
