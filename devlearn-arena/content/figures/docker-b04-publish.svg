<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>ポートの公開。-p 8080:80 は、左が外（手元の機械）の 8080 番、右が中（コンテナ）の 80 番。外から 8080 番に来た物が、中で待ち受ける 80 番に届く。公開しないと、外からは届かない</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="browser">
    <rect x="20" y="70" width="130" height="70" rx="8" fill="none" stroke="#9fb0c6" stroke-width="2" pointer-events="all" />
    <text x="85" y="100" text-anchor="middle" font-size="14" fill="#eef2f6">ブラウザ</text>
    <text x="85" y="124" text-anchor="middle" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#9fb0c6">:8080 へ</text>
  </g>
  <g class="el" data-part="host">
    <rect x="190" y="30" width="490" height="170" rx="10" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="206" y="56" font-size="14" fill="#5cc1ff">手元の機械（外）</text>
  </g>
  <g class="el" data-part="outer">
    <path d="M154 105 H222" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <rect x="228" y="82" width="96" height="46" rx="6" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="276" y="111" text-anchor="middle" font-size="16" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#5cc1ff">8080</text>
  </g>
  <g class="el" data-part="container">
    <rect x="410" y="66" width="250" height="110" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="535" y="92" text-anchor="middle" font-size="14" fill="#3ae08a">コンテナ（中）</text>
    <rect x="440" y="104" width="96" height="46" rx="6" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="488" y="133" text-anchor="middle" font-size="16" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#3ae08a">80</text>
    <text x="602" y="133" text-anchor="middle" font-size="13" fill="#9fb0c6">nginx</text>
  </g>
  <g class="el" data-part="map">
    <path d="M328 105 L434 127" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#ar)" />
    <text x="368" y="94" text-anchor="middle" font-size="13" fill="#f2b632">つなぐ</text>
  </g>
  <g class="el" data-part="left">
    <text x="300" y="262" text-anchor="end" font-size="28" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#5cc1ff">-p 8080</text>
    <rect x="160" y="232" width="148" height="44" rx="4" fill="none" stroke="#5cc1ff" stroke-width="1" pointer-events="all" />
    <text x="234" y="300" text-anchor="middle" font-size="13" fill="#5cc1ff">左: 外の番号</text>
  </g>
  <g class="el" data-part="right">
    <text x="318" y="262" font-size="28" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#3ae08a">:80</text>
    <rect x="312" y="232" width="80" height="44" rx="4" fill="none" stroke="#3ae08a" stroke-width="1" pointer-events="all" />
    <text x="352" y="300" text-anchor="middle" font-size="13" fill="#3ae08a">右: 中の番号</text>
  </g>
  <text x="420" y="262" font-size="14" fill="#9fb0c6">同じ外の番号は 1 つにしか使えない</text>
</svg>
