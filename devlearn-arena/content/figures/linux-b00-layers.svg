<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>Linux のカーネルの上に、道具一式をまとめた配布物（ディストリビューション）があり、その上でサービスが動く</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="services">
    <rect x="40" y="30" width="560" height="70" rx="12" fill="#3ae08a" />
    <text x="320" y="61" text-anchor="middle" font-size="18" font-weight="700" fill="#0a1424">サービス</text>
    <text x="320" y="83" text-anchor="middle" font-size="13" fill="#0a1424">Web サーバ・データベース・コンテナ</text>
  </g>
  <g class="el" data-part="distro">
    <rect x="40" y="130" width="560" height="110" rx="12" fill="none" stroke="#f2b632" stroke-width="2" />
    <text x="320" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#f2b632">ディストリビューション（カーネル ＋ 道具一式の配布物）</text>
    <rect x="60" y="172" width="160" height="52" rx="8" fill="#ffd66b" />
    <text x="140" y="204" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">Ubuntu</text>
    <rect x="240" y="172" width="160" height="52" rx="8" fill="#ffd66b" />
    <text x="320" y="204" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">Debian</text>
    <rect x="420" y="172" width="160" height="52" rx="8" fill="#ffd66b" />
    <text x="500" y="204" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">RHEL 系</text>
  </g>
  <g class="el" data-part="kernel">
    <rect x="40" y="270" width="560" height="70" rx="12" fill="#5cc1ff" />
    <text x="320" y="301" text-anchor="middle" font-size="18" font-weight="700" fill="#0a1424">カーネル</text>
    <text x="320" y="323" text-anchor="middle" font-size="13" fill="#0a1424">機械を直接管理する Linux の中心</text>
  </g>
  <g class="el" data-part="stack">
    <path d="M320 270 V246" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M320 130 V106" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
  </g>
</svg>
