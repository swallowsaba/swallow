<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>機械（CPU・メモリ・ストレージ）の上に OS があり、その上の 3 つのアプリに OS が資源を配る</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="app-browser">
    <rect x="40" y="30" width="170" height="64" rx="12" fill="#5cc1ff" />
    <text x="125" y="68" text-anchor="middle" font-size="18" font-weight="700" fill="#0a1424">ブラウザ</text>
  </g>
  <g class="el" data-part="app-sheet">
    <rect x="235" y="30" width="170" height="64" rx="12" fill="#5cc1ff" />
    <text x="320" y="68" text-anchor="middle" font-size="18" font-weight="700" fill="#0a1424">表計算</text>
  </g>
  <g class="el" data-part="app-music">
    <rect x="430" y="30" width="170" height="64" rx="12" fill="#5cc1ff" />
    <text x="515" y="68" text-anchor="middle" font-size="18" font-weight="700" fill="#0a1424">音楽</text>
  </g>
  <g class="el" data-part="os">
    <rect x="40" y="150" width="560" height="80" rx="12" fill="#f2b632" />
    <text x="320" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#0a1424">OS</text>
    <text x="320" y="208" text-anchor="middle" font-size="13" fill="#0a1424">資源の割り振り・ファイルの管理・利用者の管理</text>
  </g>
  <g class="el" data-part="machine">
    <rect x="40" y="280" width="560" height="64" rx="12" fill="#9aa9b5" />
    <text x="320" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">機械（CPU・メモリ・ストレージ）</text>
  </g>
  <g class="el" data-part="give">
    <path d="M125 150 V100" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M320 150 V100" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M515 150 V100" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M560 280 V236" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#arrow)" />
    <text x="334" y="128" text-anchor="start" font-size="13" font-weight="700" fill="#f2b632">配る</text>
  </g>
</svg>
