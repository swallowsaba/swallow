<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>外からの頼みは、出口から、出口への道がある外側の網に入り、そこに置いた Web の機械に届く。DB の機械は出口への道が無い内側の網に置き、外からは届かない。Web は中の網どうしで DB に頼み、画像は置き場（ストレージ）に置く</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <text x="75" y="126" text-anchor="middle" font-size="13" fill="#9fb0c6">外の利用者から</text>
  <g class="el" data-part="gw">
    <rect x="20" y="140" width="110" height="60" rx="6" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="75" y="166" text-anchor="middle" font-size="16" fill="#eef2f6">出口</text>
    <text x="75" y="188" text-anchor="middle" font-size="13" fill="#9fb0c6">外との出入り口</text>
  </g>
  <g class="el" data-part="pub">
    <rect x="170" y="20" width="330" height="130" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" stroke-dasharray="6 4" pointer-events="all" />
    <text x="186" y="46" font-size="16" fill="#eef2f6">外側の網</text>
    <text x="186" y="68" font-size="13" fill="#9fb0c6">出口への道がある</text>
  </g>
  <g class="el" data-part="priv">
    <rect x="170" y="190" width="330" height="130" rx="8" fill="none" stroke="#9fb0c6" stroke-width="2" stroke-dasharray="6 4" pointer-events="all" />
    <text x="186" y="216" font-size="16" fill="#eef2f6">内側の網</text>
    <text x="186" y="238" font-size="13" fill="#9fb0c6">出口への道が無い</text>
    <text x="186" y="300" font-size="13" fill="#ff8a7a">外からは届かない</text>
  </g>
  <line x1="132" y1="160" x2="168" y2="110" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <g class="el" data-part="web">
    <rect x="330" y="55" width="150" height="70" rx="6" fill="#0a1424" stroke="#5cc1ff" stroke-width="2" />
    <text x="405" y="84" text-anchor="middle" font-size="16" fill="#eef2f6">Web の機械</text>
    <text x="405" y="108" text-anchor="middle" font-size="13" fill="#9fb0c6">コンピュート</text>
  </g>
  <g class="el" data-part="db">
    <rect x="330" y="225" width="150" height="70" rx="6" fill="#0a1424" stroke="#5cc1ff" stroke-width="2" />
    <text x="405" y="254" text-anchor="middle" font-size="16" fill="#eef2f6">DB の機械</text>
    <text x="405" y="278" text-anchor="middle" font-size="13" fill="#9fb0c6">コンピュート</text>
  </g>
  <line x1="405" y1="127" x2="405" y2="222" stroke="#9fb0c6" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ar)" />
  <text x="414" y="178" font-size="13" fill="#9fb0c6">中の網どうしで頼む</text>
  <g class="el" data-part="store">
    <rect x="550" y="140" width="130" height="60" rx="6" fill="#0a1424" stroke="#f2b632" stroke-width="2" />
    <text x="615" y="166" text-anchor="middle" font-size="16" fill="#eef2f6">画像の置き場</text>
    <text x="615" y="188" text-anchor="middle" font-size="13" fill="#9fb0c6">ストレージ</text>
  </g>
  <line x1="482" y1="100" x2="566" y2="138" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
</svg>
