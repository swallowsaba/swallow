<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>公開されたサーバの入口を、1 つずつ閉じる</title>
  <g class="el" data-part="pass">
    <rect x="20" y="30" width="600" height="80" rx="10" fill="#c0392b" />
    <text x="320" y="64" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">パスワードでの接続</text>
    <text x="320" y="86" text-anchor="middle" font-size="14" fill="#eef2f6">鍵だけにする（PasswordAuthentication no）</text>
  </g>
  <g class="el" data-part="root">
    <rect x="20" y="125" width="600" height="80" rx="10" fill="#7a3fd0" />
    <text x="320" y="159" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">管理者への直接の接続</text>
    <text x="320" y="181" text-anchor="middle" font-size="14" fill="#eef2f6">止める（PermitRootLogin no）</text>
  </g>
  <g class="el" data-part="svc">
    <rect x="20" y="220" width="600" height="80" rx="10" fill="#1a6fd6" />
    <text x="320" y="254" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">要らないサービス</text>
    <text x="320" y="276" text-anchor="middle" font-size="14" fill="#eef2f6">止めて無効にする</text>
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">鍵を置いてから止める。先に止めると、自分も入れなくなる</text>
  </g>
</svg>
