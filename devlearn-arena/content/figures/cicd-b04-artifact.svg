<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>成果物の受け渡し。組み立ての段が作った dist/ を成果物 app として保存し、検査の段と配布の段が同じ app を受け取る。段ごとに組み立て直すと、検査した物と配る物が違うことがある</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="build">
    <rect x="20" y="80" width="150" height="72" rx="8" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="95" y="112" text-anchor="middle" font-size="16" fill="#eef2f6">組み立て</text>
    <text x="95" y="138" text-anchor="middle" font-size="13" fill="#9fb0c6">dist/ を作る</text>
  </g>
  <g class="el" data-part="artifact">
    <path d="M174 116 H226" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <text x="200" y="104" text-anchor="middle" font-size="13" fill="#9fb0c6">保存</text>
    <rect x="232" y="72" width="190" height="88" rx="8" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="327" y="106" text-anchor="middle" font-size="16" fill="#f2b632">成果物 app</text>
    <text x="327" y="132" text-anchor="middle" font-size="13" font-family="&quot;JetBrains Mono&quot;, monospace" fill="#9fb0c6">中身: dist/</text>
  </g>
  <g class="el" data-part="test">
    <path d="M426 100 L494 62" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <rect x="500" y="30" width="180" height="60" rx="8" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="590" y="58" text-anchor="middle" font-size="16" fill="#eef2f6">検査</text>
    <text x="590" y="80" text-anchor="middle" font-size="13" fill="#9fb0c6">app を受け取る</text>
  </g>
  <g class="el" data-part="deploy">
    <path d="M426 132 L494 170" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <rect x="500" y="142" width="180" height="60" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="590" y="170" text-anchor="middle" font-size="16" fill="#eef2f6">配布</text>
    <text x="590" y="192" text-anchor="middle" font-size="13" fill="#9fb0c6">同じ app を受け取る</text>
  </g>
  <g class="el" data-part="rebuild">
    <text x="20" y="262" font-size="14" fill="#ff8a7a">段ごとに組み立て直すと: 検査の時と配布の時で、取ってくる部品の版が</text>
    <text x="20" y="288" font-size="14" fill="#ff8a7a">変わることがある → 検査していない物が本番に出る</text>
  </g>
</svg>
