<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>3 つの状態と、それぞれ見る所</title>
  <g class="el" data-part="pending">
    <rect x="20" y="60" width="180" height="240" rx="10" fill="#f2b632" />
    <text x="110" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">Pending</text>
    <text x="110" y="174" text-anchor="middle" font-size="14" fill="#0a1424">置く場所が無い</text>
    <text x="110" y="196" text-anchor="middle" font-size="14" fill="#0a1424">describe の Events</text>
    <text x="110" y="218" text-anchor="middle" font-size="14" fill="#0a1424">requests を見る</text>
  </g>
  <g class="el" data-part="image">
    <rect x="230" y="60" width="180" height="240" rx="10" fill="#7a3fd0" />
    <text x="320" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">ImagePullBackOff</text>
    <text x="320" y="174" text-anchor="middle" font-size="14" fill="#eef2f6">イメージを取れない</text>
    <text x="320" y="196" text-anchor="middle" font-size="14" fill="#eef2f6">describe の Events</text>
    <text x="320" y="218" text-anchor="middle" font-size="14" fill="#eef2f6">名前とタグを見る</text>
  </g>
  <g class="el" data-part="crash">
    <rect x="440" y="60" width="180" height="240" rx="10" fill="#c0392b" />
    <text x="530" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">CrashLoopBackOff</text>
    <text x="530" y="174" text-anchor="middle" font-size="14" fill="#eef2f6">動いてすぐ終わる</text>
    <text x="530" y="196" text-anchor="middle" font-size="14" fill="#eef2f6">logs</text>
    <text x="530" y="218" text-anchor="middle" font-size="14" fill="#eef2f6">アプリの言葉を見る</text>
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">状態の名前で、原因の場所がほぼ決まる</text>
  </g>
</svg>
