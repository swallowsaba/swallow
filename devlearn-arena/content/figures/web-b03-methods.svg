<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>商品の資源に対する 4 つのメソッド。GET で取る、POST で作る、PUT で置き換える、DELETE で消す</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="resource">
    <rect x="250" y="120" width="200" height="80" rx="12" fill="#7a3fd0" />
    <text x="350" y="152" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" fill="#eef2f6">/items/3</text>
    <text x="350" y="178" text-anchor="middle" font-size="14" fill="#eef2f6">3 番の商品（資源）</text>
  </g>
  <g class="el" data-part="get">
    <rect x="30" y="40" width="170" height="64" rx="10" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="115" y="68" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" font-weight="700" fill="#5cc1ff">GET</text>
    <text x="115" y="92" text-anchor="middle" font-size="13" fill="#eef2f6">取る（変えない）</text>
    <path d="M200 90 L250 128" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  </g>
  <g class="el" data-part="post">
    <rect x="500" y="40" width="170" height="64" rx="10" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="585" y="68" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" font-weight="700" fill="#3ae08a">POST /items</text>
    <text x="585" y="92" text-anchor="middle" font-size="13" fill="#eef2f6">作る（送るたびに増える）</text>
    <path d="M500 90 L450 128" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  </g>
  <g class="el" data-part="put">
    <rect x="30" y="216" width="170" height="64" rx="10" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="115" y="244" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" font-weight="700" fill="#f2b632">PUT</text>
    <text x="115" y="268" text-anchor="middle" font-size="13" fill="#eef2f6">置き換える</text>
    <path d="M200 230 L250 192" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  </g>
  <g class="el" data-part="delete">
    <rect x="500" y="216" width="170" height="64" rx="10" fill="none" stroke="#e04a3a" stroke-width="2" pointer-events="all" />
    <text x="585" y="244" text-anchor="middle" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="16" font-weight="700" fill="#e04a3a">DELETE</text>
    <text x="585" y="268" text-anchor="middle" font-size="13" fill="#eef2f6">消す</text>
    <path d="M500 230 L450 192" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  </g>
  <g class="el" data-part="caption">
    <text x="350" y="306" text-anchor="middle" font-size="13" fill="#9fb0c6">同じ URL でも、メソッドで「何をしたいか」が変わる</text>
  </g>
</svg>
