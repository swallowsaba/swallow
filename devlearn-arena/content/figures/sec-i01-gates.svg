<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>ブラウザは証明書を 4 つの関門で確かめる。期限・名前・連鎖・失効のどれか 1 つでも通らなければ警告を出す</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="flow">
    <path d="M20 90 H620" fill="none" stroke="#f2b632" stroke-width="3" marker-end="url(#arrow-gold)" />
    <text x="20" y="40" font-size="16" font-weight="700" fill="#eef2f6">サーバの証明書が届く</text>
    <text x="620" y="40" text-anchor="end" font-size="16" font-weight="700" fill="#3ae08a">全て通れば鍵の印</text>
  </g>
  <g class="el" data-part="expiry">
    <rect x="30" y="64" width="130" height="52" rx="10" fill="#c0392b" />
    <text x="95" y="96" text-anchor="middle" font-size="18" font-weight="700" fill="#eef2f6">期限</text>
    <text x="95" y="150" text-anchor="middle" font-size="13" fill="#eef2f6">切れている</text>
    <text x="95" y="172" text-anchor="middle" font-size="13" fill="#ff8a7a">has expired</text>
  </g>
  <g class="el" data-part="name">
    <rect x="180" y="64" width="130" height="52" rx="10" fill="#c0392b" />
    <text x="245" y="96" text-anchor="middle" font-size="18" font-weight="700" fill="#eef2f6">名前</text>
    <text x="245" y="150" text-anchor="middle" font-size="13" fill="#eef2f6">開いた名前が無い</text>
    <text x="245" y="172" text-anchor="middle" font-size="13" fill="#ff8a7a">name matches</text>
  </g>
  <g class="el" data-part="chain">
    <rect x="330" y="64" width="130" height="52" rx="10" fill="#c0392b" />
    <text x="395" y="96" text-anchor="middle" font-size="18" font-weight="700" fill="#eef2f6">連鎖</text>
    <text x="395" y="150" text-anchor="middle" font-size="13" fill="#eef2f6">ルートまでたどれない</text>
    <text x="395" y="172" text-anchor="middle" font-size="13" fill="#ff8a7a">local issuer</text>
  </g>
  <g class="el" data-part="revocation">
    <rect x="480" y="64" width="130" height="52" rx="10" fill="#c0392b" />
    <text x="545" y="96" text-anchor="middle" font-size="18" font-weight="700" fill="#eef2f6">失効</text>
    <text x="545" y="150" text-anchor="middle" font-size="13" fill="#eef2f6">取り消されている</text>
    <text x="545" y="172" text-anchor="middle" font-size="13" fill="#ff8a7a">revoked</text>
  </g>
  <g class="el" data-part="note">
    <rect x="30" y="220" width="580" height="110" rx="12" fill="#0a1424" stroke="#9fb0c6" stroke-width="2" />
    <text x="320" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#ffd66b">どの関門で止まったかは、警告の文で分かる</text>
    <text x="320" y="288" text-anchor="middle" font-size="14" fill="#eef2f6">期限は全員に同時に出る。名前は開いた名前だけに出る</text>
    <text x="320" y="312" text-anchor="middle" font-size="14" fill="#eef2f6">連鎖の欠けは、中間証明書を持たない端末だけに出ることがある</text>
  </g>
</svg>
