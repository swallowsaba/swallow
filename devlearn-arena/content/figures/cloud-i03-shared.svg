<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>IaaS・PaaS・SaaS で責任の境目が変わる。データと権限の設定はどの形でも利用者の責任</title>
  <g class="el" data-part="user">
    <rect x="20" y="30" width="600" height="100" rx="10" fill="#f2b632" />
    <text x="320" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">利用者が必ず守る</text>
    <text x="320" y="96" text-anchor="middle" font-size="14" fill="#0a1424">データ・権限・公開の設定</text>
  </g>
  <g class="el" data-part="border">
    <rect x="20" y="145" width="600" height="60" rx="10" fill="#7a3fd0" />
    <text x="320" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">形で変わる: OS・実行環境・アプリ（IaaS ほど利用者）</text>
  </g>
  <g class="el" data-part="provider">
    <rect x="20" y="220" width="600" height="80" rx="10" fill="#1a6fd6" />
    <text x="320" y="254" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">提供者が守る</text>
    <text x="320" y="276" text-anchor="middle" font-size="14" fill="#eef2f6">建物・電源・物理の機械・網</text>
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">クラウドだから安全、ではない。設定の誤りは利用者の事故</text>
  </g>
</svg>
