<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>HTTP/1.1 は 1 本の接続で部品を 1 つずつ順番に受け取る。HTTP/2 は 1 本の接続で同時に受け取り、早く終わる。HTTP/3 は同じやり方を UDP の上で動かす。版が変わっても URL は https:// のまま</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="time">
    <text x="170" y="22" font-size="13" fill="#9fb0c6">時間</text>
    <path d="M206 18 H676" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  </g>
  <g class="el" data-part="h1">
    <text x="20" y="74" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" font-weight="700" fill="#eef2f6">HTTP/1.1</text>
    <text x="20" y="96" font-size="13" fill="#9fb0c6">順番に 1 つずつ</text>
    <rect x="170" y="48" width="510" height="56" rx="10" fill="none" stroke="#9fb0c6" stroke-width="2" />
    <rect x="178" y="58" width="118" height="36" rx="6" fill="#5cc1ff" />
    <text x="237" y="81" text-anchor="middle" font-size="13" fill="#0a1424">HTML</text>
    <rect x="302" y="58" width="118" height="36" rx="6" fill="#5cc1ff" />
    <text x="361" y="81" text-anchor="middle" font-size="13" fill="#0a1424">CSS</text>
    <rect x="426" y="58" width="118" height="36" rx="6" fill="#5cc1ff" />
    <text x="485" y="81" text-anchor="middle" font-size="13" fill="#0a1424">画像 1</text>
    <rect x="550" y="58" width="118" height="36" rx="6" fill="#5cc1ff" />
    <text x="609" y="81" text-anchor="middle" font-size="13" fill="#0a1424">画像 2</text>
  </g>
  <g class="el" data-part="h2">
    <text x="20" y="170" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" font-weight="700" fill="#eef2f6">HTTP/2</text>
    <text x="20" y="192" font-size="13" fill="#9fb0c6">1 本で同時に</text>
    <rect x="170" y="122" width="510" height="134" rx="10" fill="none" stroke="#3ae08a" stroke-width="2" />
    <rect x="178" y="130" width="118" height="26" rx="6" fill="#3ae08a" />
    <text x="237" y="148" text-anchor="middle" font-size="13" fill="#0a1424">HTML</text>
    <rect x="178" y="160" width="118" height="26" rx="6" fill="#3ae08a" />
    <text x="237" y="178" text-anchor="middle" font-size="13" fill="#0a1424">CSS</text>
    <rect x="178" y="190" width="118" height="26" rx="6" fill="#3ae08a" />
    <text x="237" y="208" text-anchor="middle" font-size="13" fill="#0a1424">画像 1</text>
    <rect x="178" y="220" width="118" height="26" rx="6" fill="#3ae08a" />
    <text x="237" y="238" text-anchor="middle" font-size="13" fill="#0a1424">画像 2</text>
    <path d="M304 130 V246" fill="none" stroke="#3ae08a" stroke-width="2" stroke-dasharray="4 4" />
    <text x="320" y="182" font-size="14" fill="#3ae08a">ここで全部そろう</text>
    <text x="320" y="206" font-size="13" fill="#9fb0c6">HTTP/1.1 より待ちが少ない</text>
  </g>
  <g class="el" data-part="h3">
    <text x="20" y="292" font-family="&quot;JetBrains Mono&quot;, monospace" font-size="14" font-weight="700" fill="#f2b632">HTTP/3</text>
    <text x="170" y="292" font-size="13" fill="#eef2f6">同じ「同時に」のやり方を、UDP の上で動かす（つなぐまでが速い）</text>
    <text x="170" y="316" font-size="13" fill="#9fb0c6">版が変わっても、URL は https:// のまま</text>
  </g>
</svg>
