<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>HPA は 15 秒ごとに、Pod の CPU の使用率（要求に対する割合）を目標と比べて数を決める。混めば目標に近づくまで増やし、空けば 5 分様子を見てから min まで減らす。要求が無いと使用率を計算できず、増えない</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <text x="20" y="26" font-size="13" fill="#9fb0c6">CPU の使用率（Pod 1 つの要求 200m に対する割合）と Pod の数。目標は 50%</text>
  <g class="el" data-part="calm">
    <rect x="20" y="44" width="200" height="176" rx="6" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="120" y="70" text-anchor="middle" font-size="16" fill="#eef2f6">朝: 静か</text>
    <text x="120" y="98" text-anchor="middle" font-size="13" fill="#9fb0c6">使用率 1%</text>
    <rect x="96" y="124" width="20" height="28" rx="3" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <rect x="124" y="124" width="20" height="28" rx="3" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="120" y="182" text-anchor="middle" font-size="13" fill="#eef2f6">2 つ（min）</text>
    <text x="120" y="204" text-anchor="middle" font-size="13" fill="#9fb0c6">これより減らさない</text>
  </g>
  <g class="el" data-part="busy">
    <rect x="250" y="44" width="200" height="176" rx="6" fill="none" stroke="#ff8a7a" stroke-width="2" pointer-events="all" />
    <text x="350" y="70" text-anchor="middle" font-size="16" fill="#eef2f6">昼: 利用者が 10 倍</text>
    <text x="350" y="98" text-anchor="middle" font-size="13" fill="#ff8a7a">使用率 175%</text>
    <rect x="263" y="124" width="20" height="28" rx="3" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <rect x="288" y="124" width="20" height="28" rx="3" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <rect x="313" y="124" width="20" height="28" rx="3" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <rect x="338" y="124" width="20" height="28" rx="3" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <rect x="363" y="124" width="20" height="28" rx="3" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <rect x="388" y="124" width="20" height="28" rx="3" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <rect x="413" y="124" width="20" height="28" rx="3" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="350" y="182" text-anchor="middle" font-size="13" fill="#eef2f6">7 つに増やす</text>
    <text x="350" y="204" text-anchor="middle" font-size="13" fill="#9fb0c6">使用率が 50% 近くに下がる</text>
  </g>
  <g class="el" data-part="quiet">
    <rect x="480" y="44" width="200" height="176" rx="6" fill="none" stroke="#5cc1ff" stroke-width="2" stroke-dasharray="6 4" pointer-events="all" />
    <text x="580" y="70" text-anchor="middle" font-size="16" fill="#eef2f6">夕方: 空いた</text>
    <text x="580" y="98" text-anchor="middle" font-size="13" fill="#9fb0c6">使用率 0%</text>
    <rect x="556" y="124" width="20" height="28" rx="3" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <rect x="584" y="124" width="20" height="28" rx="3" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="580" y="182" text-anchor="middle" font-size="13" fill="#eef2f6">5 分待って 2 つに</text>
    <text x="580" y="204" text-anchor="middle" font-size="13" fill="#9fb0c6">すぐには減らさない</text>
  </g>
  <line x1="222" y1="132" x2="246" y2="132" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <line x1="452" y1="132" x2="476" y2="132" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <g class="el" data-part="formula">
    <rect x="20" y="240" width="660" height="50" rx="6" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="350" y="271" text-anchor="middle" font-size="16" fill="#eef2f6">必要な数 = 今の数 × 使用率 ÷ 目標　（2 × 175% ÷ 50% = 7）</text>
  </g>
  <g class="el" data-part="unknown">
    <rect x="20" y="302" width="660" height="44" rx="6" fill="none" stroke="#ff8a7a" stroke-width="2" stroke-dasharray="6 4" pointer-events="all" />
    <text x="350" y="329" text-anchor="middle" font-size="13" fill="#ff8a7a">要求（requests）が無いと使用率を計算できず、増えない（TARGETS が cpu: &lt;unknown&gt;/50%）</text>
  </g>
</svg>
