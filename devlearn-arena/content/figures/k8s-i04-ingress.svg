<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>Ingress は 1 つの入口。頼みの名前と道に合う規則を選び、規則に書いた Service に渡す。Service が、後ろの Ready の Pod に届ける</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <text x="14" y="34" font-size="13" fill="#9fb0c6">頼み</text>
  <text x="14" y="58" font-size="13" fill="#eef2f6" font-family="&quot;JetBrains Mono&quot;, monospace">city.example/api/rooms</text>
  <line x1="86" y1="68" x2="86" y2="106" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <g class="el" data-part="ingress">
    <rect x="12" y="110" width="150" height="150" rx="8" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="87" y="142" text-anchor="middle" font-size="16" fill="#f2b632">Ingress</text>
    <text x="87" y="168" text-anchor="middle" font-size="13" fill="#9fb0c6">入口は 1 つ</text>
    <text x="87" y="200" text-anchor="middle" font-size="13" fill="#eef2f6" font-family="&quot;JetBrains Mono&quot;, monospace">city.example</text>
    <text x="87" y="232" text-anchor="middle" font-size="13" fill="#9fb0c6">名前と道で選ぶ</text>
  </g>
  <g class="el" data-part="rule-root">
    <rect x="200" y="40" width="150" height="100" rx="8" fill="none" stroke="#9fb0c6" stroke-width="2" pointer-events="all" />
    <text x="275" y="72" text-anchor="middle" font-size="14" fill="#eef2f6">規則</text>
    <text x="275" y="100" text-anchor="middle" font-size="14" fill="#eef2f6" font-family="&quot;JetBrains Mono&quot;, monospace">/</text>
    <text x="275" y="124" text-anchor="middle" font-size="13" fill="#9fb0c6">ほかの全ての道</text>
  </g>
  <g class="el" data-part="rule-api">
    <rect x="200" y="200" width="150" height="100" rx="8" fill="none" stroke="#9fb0c6" stroke-width="2" pointer-events="all" />
    <text x="275" y="232" text-anchor="middle" font-size="14" fill="#eef2f6">規則</text>
    <text x="275" y="260" text-anchor="middle" font-size="14" fill="#eef2f6" font-family="&quot;JetBrains Mono&quot;, monospace">/api</text>
    <text x="275" y="284" text-anchor="middle" font-size="13" fill="#9fb0c6">/api の下の道</text>
  </g>
  <g class="el" data-part="svc-shop">
    <rect x="388" y="40" width="150" height="100" rx="8" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="463" y="72" text-anchor="middle" font-size="14" fill="#5cc1ff">Service shop</text>
    <text x="463" y="100" text-anchor="middle" font-size="13" fill="#9fb0c6">80 番</text>
    <text x="463" y="124" text-anchor="middle" font-size="13" fill="#9fb0c6">売店の画面</text>
  </g>
  <g class="el" data-part="svc-api">
    <rect x="388" y="200" width="150" height="100" rx="8" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="463" y="232" text-anchor="middle" font-size="14" fill="#5cc1ff">Service api</text>
    <text x="463" y="260" text-anchor="middle" font-size="13" fill="#9fb0c6">80 番</text>
    <text x="463" y="284" text-anchor="middle" font-size="13" fill="#9fb0c6">施設の空き</text>
  </g>
  <g class="el" data-part="pod-shop">
    <rect x="576" y="40" width="112" height="100" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="632" y="80" text-anchor="middle" font-size="14" fill="#3ae08a">Pod</text>
    <text x="632" y="108" text-anchor="middle" font-size="13" fill="#9fb0c6">80 番で待つ</text>
  </g>
  <g class="el" data-part="pod-api">
    <rect x="576" y="200" width="112" height="100" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="632" y="240" text-anchor="middle" font-size="14" fill="#3ae08a">Pod</text>
    <text x="632" y="268" text-anchor="middle" font-size="13" fill="#9fb0c6">3000 番で待つ</text>
  </g>
  <line x1="164" y1="160" x2="196" y2="110" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <line x1="164" y1="210" x2="196" y2="240" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <line x1="352" y1="90" x2="384" y2="90" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <line x1="352" y1="250" x2="384" y2="250" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <line x1="540" y1="90" x2="572" y2="90" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <line x1="540" y1="250" x2="572" y2="250" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <text x="350" y="328" text-anchor="middle" font-size="13" fill="#9fb0c6">合う規則が無ければ 404、届く Pod が無ければ 503</text>
</svg>
