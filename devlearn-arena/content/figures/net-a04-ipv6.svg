<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>128 ビットの住所の書き方と、省略の 2 つの決まり</title>
  <g class="el" data-part="full">
    <rect x="20" y="40" width="600" height="80" rx="10" fill="#1a6fd6" />
    <text x="320" y="74" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">全部書く</text>
    <text x="320" y="96" text-anchor="middle" font-size="14" fill="#eef2f6">2001:0db8:0000:0000:0000:0000:0000:0001</text>
  </g>
  <g class="el" data-part="zero">
    <rect x="20" y="135" width="600" height="80" rx="10" fill="#7a3fd0" />
    <text x="320" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">各組の頭の 0 を省く</text>
    <text x="320" y="191" text-anchor="middle" font-size="14" fill="#eef2f6">2001:db8:0:0:0:0:0:1</text>
  </g>
  <g class="el" data-part="colon">
    <rect x="20" y="230" width="600" height="80" rx="10" fill="#f2b632" />
    <text x="320" y="264" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">0 の続きを :: で 1 回だけ省く</text>
    <text x="320" y="286" text-anchor="middle" font-size="14" fill="#0a1424">2001:db8::1</text>
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">名前との対応は A ではなく AAAA</text>
  </g>
</svg>
