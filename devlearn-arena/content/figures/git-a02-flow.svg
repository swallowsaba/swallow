<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>短い枝 → 依頼 → 検査と承認 → 保護された main → タグでリリース</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="branch">
    <rect x="20" y="110" width="100" height="110" rx="10" fill="#1a6fd6" />
    <text x="70" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">短い枝</text>
  </g>
  <g class="el" data-part="pr">
    <rect x="144" y="110" width="100" height="110" rx="10" fill="#7a3fd0" />
    <text x="194" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">依頼</text>
  </g>
  <g class="el" data-part="check">
    <rect x="268" y="110" width="100" height="110" rx="10" fill="#f2b632" />
    <text x="318" y="159" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">検査と</text>
    <text x="318" y="181" text-anchor="middle" font-size="14" fill="#0a1424">承認</text>
  </g>
  <g class="el" data-part="main">
    <rect x="392" y="110" width="100" height="110" rx="10" fill="#1f7a4d" />
    <text x="442" y="159" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">保護された</text>
    <text x="442" y="181" text-anchor="middle" font-size="14" fill="#eef2f6">main</text>
  </g>
  <g class="el" data-part="tag">
    <rect x="516" y="110" width="100" height="110" rx="10" fill="#c0392b" />
    <text x="566" y="159" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">タグで</text>
    <text x="566" y="181" text-anchor="middle" font-size="14" fill="#eef2f6">リリース</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M120 165 L141 165" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M244 165 L265 165" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M368 165 L389 165" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M492 165 L513 165" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">誰も main に直接入れられない</text>
  </g>
</svg>
