<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>同じアプリが乗っ取られても、root で動いていれば機械の全てを壊され、専用の利用者なら書く場所だけで止まる</title>
  <g class="el" data-part="wide">
    <rect x="20" y="40" width="280" height="240" rx="10" fill="#c0392b" />
    <text x="160" y="121" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">root で動くアプリ</text>
    <text x="160" y="143" text-anchor="middle" font-size="14" fill="#eef2f6">乗っ取られると</text>
    <text x="160" y="165" text-anchor="middle" font-size="14" fill="#eef2f6">全ファイルを読める</text>
    <text x="160" y="187" text-anchor="middle" font-size="14" fill="#eef2f6">秘密鍵も盗める</text>
    <text x="160" y="209" text-anchor="middle" font-size="14" fill="#eef2f6">機械の全体を壊せる</text>
  </g>
  <g class="el" data-part="narrow">
    <rect x="340" y="40" width="280" height="240" rx="10" fill="#1f7a4d" />
    <text x="480" y="121" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">専用の利用者で動くアプリ</text>
    <text x="480" y="143" text-anchor="middle" font-size="14" fill="#eef2f6">乗っ取られても</text>
    <text x="480" y="165" text-anchor="middle" font-size="14" fill="#eef2f6">書けるのは /var/lib/report だけ</text>
    <text x="480" y="187" text-anchor="middle" font-size="14" fill="#eef2f6">/etc の秘密は読めない</text>
    <text x="480" y="209" text-anchor="middle" font-size="14" fill="#eef2f6">被害はここで止まる</text>
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">権限の広さが、そのまま被害の広さになる</text>
  </g>
</svg>
