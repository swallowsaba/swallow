<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>各段の時間。合計 20 分のうち、依存の取得が一番長い</title>
  <g class="el" data-part="install">
    <rect x="20" y="40" width="290" height="110" rx="10" fill="#c0392b" />
    <text x="165" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">依存の取得</text>
    <text x="165" y="100" text-anchor="middle" font-size="14" fill="#eef2f6">12 分（3 回）</text>
    <text x="165" y="122" text-anchor="middle" font-size="14" fill="#eef2f6">キャッシュで縮む</text>
  </g>
  <g class="el" data-part="lint">
    <rect x="330" y="40" width="290" height="110" rx="10" fill="#1a6fd6" />
    <text x="475" y="89" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">静的な検査</text>
    <text x="475" y="111" text-anchor="middle" font-size="14" fill="#eef2f6">1 分</text>
  </g>
  <g class="el" data-part="unit">
    <rect x="20" y="170" width="290" height="110" rx="10" fill="#7a3fd0" />
    <text x="165" y="208" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">単体テスト</text>
    <text x="165" y="230" text-anchor="middle" font-size="14" fill="#eef2f6">2 分</text>
    <text x="165" y="252" text-anchor="middle" font-size="14" fill="#eef2f6">並行にできる</text>
  </g>
  <g class="el" data-part="e2e">
    <rect x="330" y="170" width="290" height="110" rx="10" fill="#f2b632" />
    <text x="475" y="208" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">E2E テスト</text>
    <text x="475" y="230" text-anchor="middle" font-size="14" fill="#0a1424">5 分</text>
    <text x="475" y="252" text-anchor="middle" font-size="14" fill="#0a1424">並行にできる</text>
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">長い段から。キャッシュと並行で縮め、結果が同じことを確かめる</text>
  </g>
</svg>
