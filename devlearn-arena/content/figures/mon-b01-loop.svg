<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>監視は、測る（ログ・メトリクス・トレース）→ 見る → 知らせる → 調べる、を繰り返す。利用者からの連絡より先に気付き、調べる材料を残す</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="measure">
    <rect x="20" y="40" width="176" height="176" rx="6" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="108" y="70" text-anchor="middle" font-size="16" fill="#eef2f6">測る</text>
    <text x="108" y="100" text-anchor="middle" font-size="13" fill="#eef2f6">ログ</text>
    <text x="108" y="117" text-anchor="middle" font-size="13" fill="#9fb0c6">出来事の記録</text>
    <text x="108" y="141" text-anchor="middle" font-size="13" fill="#eef2f6">メトリクス</text>
    <text x="108" y="158" text-anchor="middle" font-size="13" fill="#9fb0c6">数値の推移</text>
    <text x="108" y="182" text-anchor="middle" font-size="13" fill="#eef2f6">トレース</text>
    <text x="108" y="199" text-anchor="middle" font-size="13" fill="#9fb0c6">頼みが通った道</text>
  </g>
  <line x1="198" y1="128" x2="222" y2="128" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <g class="el" data-part="watch">
    <rect x="226" y="40" width="140" height="176" rx="6" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="296" y="70" text-anchor="middle" font-size="16" fill="#eef2f6">見る</text>
    <polyline points="246,170 266,166 286,168 306,120 326,116 346,164" fill="none" stroke="#3ae08a" stroke-width="2" />
    <text x="296" y="200" text-anchor="middle" font-size="13" fill="#9fb0c6">グラフで変化を</text>
  </g>
  <line x1="368" y1="128" x2="392" y2="128" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <g class="el" data-part="notify">
    <rect x="396" y="40" width="140" height="176" rx="6" fill="none" stroke="#f2b632" stroke-width="2" pointer-events="all" />
    <text x="466" y="70" text-anchor="middle" font-size="16" fill="#eef2f6">知らせる</text>
    <text x="466" y="120" text-anchor="middle" font-size="13" fill="#eef2f6">アラート</text>
    <text x="466" y="150" text-anchor="middle" font-size="13" fill="#9fb0c6">条件を満たしたら</text>
    <text x="466" y="170" text-anchor="middle" font-size="13" fill="#9fb0c6">人に通知</text>
  </g>
  <line x1="538" y1="128" x2="562" y2="128" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
  <g class="el" data-part="investigate">
    <rect x="566" y="40" width="114" height="176" rx="6" fill="none" stroke="#ff8a7a" stroke-width="2" pointer-events="all" />
    <text x="623" y="70" text-anchor="middle" font-size="16" fill="#eef2f6">調べる</text>
    <text x="623" y="120" text-anchor="middle" font-size="13" fill="#9fb0c6">いつから</text>
    <text x="623" y="146" text-anchor="middle" font-size="13" fill="#9fb0c6">どこで</text>
    <text x="623" y="172" text-anchor="middle" font-size="13" fill="#9fb0c6">なぜ</text>
  </g>
  <path d="M623 218 L623 262 L108 262 L108 222" fill="none" stroke="#9fb0c6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)" />
  <text x="366" y="254" text-anchor="middle" font-size="13" fill="#9fb0c6">直したら、また測り続ける</text>
  <g class="el" data-part="before-call">
    <text x="350" y="300" text-anchor="middle" font-size="13" fill="#eef2f6">利用者からの連絡より先に気付き、調べる材料を残す</text>
  </g>
</svg>
