<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>入口の証明書、中継、アプリの順に症状が分かれる</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="tls">
    <rect x="20" y="70" width="180" height="150" rx="10" fill="#c0392b" />
    <text x="110" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">入口</text>
    <text x="110" y="150" text-anchor="middle" font-size="14" fill="#eef2f6">証明書の警告</text>
    <text x="110" y="172" text-anchor="middle" font-size="14" fill="#eef2f6">連鎖の欠け</text>
  </g>
  <g class="el" data-part="proxy">
    <rect x="230" y="70" width="180" height="150" rx="10" fill="#f2b632" />
    <text x="320" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">中継</text>
    <text x="320" y="150" text-anchor="middle" font-size="14" fill="#0a1424">502</text>
    <text x="320" y="172" text-anchor="middle" font-size="14" fill="#0a1424">ポートの誤り</text>
  </g>
  <g class="el" data-part="app">
    <rect x="440" y="70" width="180" height="150" rx="10" fill="#1a6fd6" />
    <text x="530" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">アプリ</text>
    <text x="530" y="150" text-anchor="middle" font-size="14" fill="#eef2f6">500</text>
    <text x="530" y="172" text-anchor="middle" font-size="14" fill="#eef2f6">アプリの誤り</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M200 145 L226 145" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M410 145 L436 145" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">一部の端末だけ警告なら、連鎖の欠けを疑う</text>
  </g>
</svg>
