<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>作る段（道具が多い）→ 成果物だけ → 動かす段（小さい）</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="build">
    <rect x="20" y="110" width="184" height="130" rx="10" fill="#c0392b" />
    <text x="112" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">作る段</text>
    <text x="112" y="180" text-anchor="middle" font-size="14" fill="#eef2f6">node:20（1.1GB）</text>
    <text x="112" y="202" text-anchor="middle" font-size="14" fill="#eef2f6">道具が多い</text>
  </g>
  <g class="el" data-part="output">
    <rect x="228" y="110" width="184" height="130" rx="10" fill="#f2b632" />
    <text x="320" y="169" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">成果物だけ</text>
    <text x="320" y="191" text-anchor="middle" font-size="14" fill="#0a1424">dist</text>
  </g>
  <g class="el" data-part="run">
    <rect x="436" y="110" width="184" height="130" rx="10" fill="#1f7a4d" />
    <text x="528" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">動かす段</text>
    <text x="528" y="180" text-anchor="middle" font-size="14" fill="#eef2f6">nginx（48MB）</text>
    <text x="528" y="202" text-anchor="middle" font-size="14" fill="#eef2f6">要る物だけ</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M204 175 L225 175" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
    <path d="M412 175 L433 175" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">最後の段だけがイメージに入る</text>
  </g>
</svg>
