<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>その場の対処と、恒久の対策の違い</title>
  <defs>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b632" />
    </marker>
  </defs>
  <g class="el" data-part="now">
    <rect x="20" y="70" width="280" height="210" rx="10" fill="#f2b632" />
    <text x="160" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#0a1424">その場の対処</text>
    <text x="160" y="180" text-anchor="middle" font-size="14" fill="#0a1424">手でログを消す</text>
    <text x="160" y="202" text-anchor="middle" font-size="14" fill="#0a1424">また同じ事が起きる</text>
  </g>
  <g class="el" data-part="lasting">
    <rect x="340" y="70" width="280" height="210" rx="10" fill="#1f7a4d" />
    <text x="480" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">恒久の対策</text>
    <text x="480" y="180" text-anchor="middle" font-size="14" fill="#eef2f6">自動の整理・監視・上限</text>
    <text x="480" y="202" text-anchor="middle" font-size="14" fill="#eef2f6">起きなくなったか測る</text>
  </g>
  <g class="el" data-part="flow">
    <path d="M300 175 L337 175" fill="none" stroke="#f2b632" stroke-width="2" marker-end="url(#arrow-gold)" />
  </g>
  <g class="el" data-part="note">
    <text x="320" y="340" text-anchor="middle" font-size="14" fill="#eef2f6">仕組みで防ぎ、効いたかを測る</text>
  </g>
</svg>
