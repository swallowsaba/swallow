<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="&quot;Noto Sans JP&quot;, sans-serif">
  <title>CI と CD の流れ。変更を送ると、組み立て・検査（CI）、配布（CD）が自動で順に流れる。検査で失敗すれば、そこで止まり本番に届かない</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0c6" />
    </marker>
  </defs>
  <g class="el" data-part="change">
    <rect x="20" y="50" width="140" height="80" rx="8" fill="none" stroke="#9fb0c6" stroke-width="2" pointer-events="all" />
    <text x="90" y="84" text-anchor="middle" font-size="16" fill="#eef2f6">変更</text>
    <text x="90" y="110" text-anchor="middle" font-size="13" fill="#9fb0c6">記録して送る</text>
  </g>
  <g class="el" data-part="build">
    <path d="M164 90 H190" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <rect x="196" y="50" width="140" height="80" rx="8" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="266" y="84" text-anchor="middle" font-size="16" fill="#5cc1ff">組み立て</text>
    <text x="266" y="110" text-anchor="middle" font-size="13" fill="#9fb0c6">ビルド</text>
  </g>
  <g class="el" data-part="test">
    <path d="M340 90 H366" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <rect x="372" y="50" width="140" height="80" rx="8" fill="none" stroke="#5cc1ff" stroke-width="2" pointer-events="all" />
    <text x="442" y="84" text-anchor="middle" font-size="16" fill="#5cc1ff">検査</text>
    <text x="442" y="110" text-anchor="middle" font-size="13" fill="#9fb0c6">テスト</text>
  </g>
  <g class="el" data-part="deploy">
    <path d="M516 90 H542" fill="none" stroke="#9fb0c6" stroke-width="2" marker-end="url(#ar)" />
    <rect x="548" y="50" width="132" height="80" rx="8" fill="none" stroke="#3ae08a" stroke-width="2" pointer-events="all" />
    <text x="614" y="84" text-anchor="middle" font-size="16" fill="#3ae08a">配布</text>
    <text x="614" y="110" text-anchor="middle" font-size="13" fill="#9fb0c6">デプロイ</text>
  </g>
  <g class="el" data-part="ci">
    <path d="M196 148 V158 H512 V148" fill="none" stroke="#5cc1ff" stroke-width="2" />
    <text x="354" y="184" text-anchor="middle" font-size="16" fill="#5cc1ff">CI（変更のたびに自動で）</text>
  </g>
  <g class="el" data-part="cd">
    <path d="M548 148 V158 H680 V148" fill="none" stroke="#3ae08a" stroke-width="2" />
    <text x="614" y="184" text-anchor="middle" font-size="16" fill="#3ae08a">CD</text>
  </g>
  <g class="el" data-part="note">
    <text x="20" y="236" font-size="14" fill="#ff8a7a">手作業: 手順書を見て人が打つ → 抜け・打ち間違い</text>
    <text x="20" y="266" font-size="14" fill="#eef2f6">自動: 毎回同じ順。検査で失敗したら止まり、本番に届かない</text>
  </g>
</svg>
