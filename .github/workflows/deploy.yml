# ============================================================================
#  Swallow + Build 版 GitHub Actions 設定ファイル
#  ----------------------------------------------------------------------------
#  元の Swallow（静的サイトを並べて目次を自動生成する仕組み）に加えて、
#  「package.json があるサブフォルダは npm でビルドしてから公開する」機能を
#  足したものです。これで RAW Studio のような Vite/React/TypeScript の
#  “要ビルド”プロジェクトも、あなたのPCで install せずに公開できます。
#  （install は GitHub の貸しパソコン上で走ります）
#
#  想定する置き方:
#    swallow-repo/
#      ├─ raw-studio/        ← package.json あり → 自動で npm run build
#      │    └─ (Viteのソース一式)
#      ├─ some-static-site/  ← index.html だけの静的サイト → そのままコピー
#      └─ .github/workflows/deploy.yml  ← このファイル
#
#  公開後URL: https://<ユーザー名>.github.io/<リポジトリ名>/raw-studio/
# ============================================================================

name: Deploy to GitHub Pages (Swallow + build)

# on: いつ動かすか。main への push と、手動ボタン。
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# permissions: ロボットに与える権限。
permissions:
  contents: read
  pages: write
  id-token: write

# concurrency: 公開作業が同時多発しないよう交通整理。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 【手順1】リポジトリのファイル一式を貸しパソコンに取得。
      - name: Checkout
        uses: actions/checkout@v4

      # 【手順2】Node.js（npm を動かすための実行環境）を用意。
      #          ※ 速度を上げたい場合は、各プロジェクトに package-lock.json を
      #            コミットした上で、下に
      #              cache: npm
      #              cache-dependency-path: "**/package-lock.json"
      #            を足すとダウンロードを再利用できる（lockfile必須なので既定では無効）。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 【手順3】サブプロジェクトをビルドし、公開用フォルダ(_site)を組み立て、
      #          最後に目次(index.html)を自動生成する。ここが心臓部。
      - name: Build subprojects and assemble site
        run: |
          set -euo pipefail
          shopt -s nullglob

          # リポジトリ名（例: raw-studio ではなく Swallow 側のリポジトリ名）。
          # Vite の base（アセットの参照先パス）を組み立てるのに使う。
          REPO_SHORT="${{ github.event.repository.name }}"

          # 公開用の出力フォルダ。ここに入れた中身だけが Web に出る。
          OUT="_site"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          # トップ階層のフォルダを1つずつ処理する。
          for dir in */ ; do
            name="${dir%/}"

            # 隠しフォルダ・出力フォルダ・node_modules は対象外。
            case "$name" in
              .*|_site|node_modules) continue ;;
            esac

            if [ -f "$name/package.json" ]; then
              # --- 要ビルドのプロジェクト（Vite など） ---
              echo "::group::Building $name"

              # 公開URLが /<repo>/<name>/ になるので、アセット参照も同じ絶対パスに
              # 合わせる。RAW Studio の vite.config.ts はこの VITE_BASE を読む。
              export VITE_BASE="/$REPO_SHORT/$name/"

              (
                cd "$name"
                # lockfile があれば再現性の高い npm ci、無ければ npm install。
                if [ -f package-lock.json ]; then
                  npm ci
                else
                  npm install
                fi
                npm run build
              )

              # Vite の出力先は既定で dist/。その中身を _site/<name>/ へ複製。
              if [ -d "$name/dist" ]; then
                mkdir -p "$OUT/$name"
                cp -r "$name/dist/." "$OUT/$name/"
              else
                echo "ERROR: '$name' has package.json but produced no dist/." >&2
                exit 1
              fi

              echo "::endgroup::"

            elif [ -f "$name/index.html" ]; then
              # --- ビルド不要の静的サイト。そのままコピー。 ---
              echo "Copying static project: $name"
              mkdir -p "$OUT/$name"
              cp -r "$name/." "$OUT/$name/"
            fi
          done

          # 組み立てた _site の中から、index.html を持つ直下フォルダを列挙して目次を作る。
          mapfile -t DIRS < <(find "$OUT" -mindepth 2 -maxdepth 2 -name index.html \
                                | sed -E "s|^$OUT/||;s|/index\.html$||" | sort)

          # --- ここから目次HTMLの組み立て（Swallow の見た目を踏襲） ---
          # 【重要】次の HTML_HEAD 〜 HTML_HEAD の“中”はそのままHTMLとして出力される。
          #         だから枠の中には説明コメントを書けない（画面に出てしまう）。
          {
          cat <<'HTML_HEAD'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Swallow — Projects</title>
          <style>
            :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--text-dim:#8d96a0;--accent:#58a6ff;--purple:#a371f7}
            *{box-sizing:border-box}
            body{margin:0;padding:40px 20px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
            h1{font-size:32px;margin:0 0 8px;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
            .sub{color:var(--text-dim);margin-bottom:32px;font-size:14px}
            .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;max-width:900px;width:100%}
            a.card{display:block;padding:18px 20px;background:var(--panel);border:1px solid var(--border);border-radius:10px;color:var(--text);text-decoration:none;transition:border-color .15s,transform .1s,box-shadow .15s}
            a.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 16px rgba(88,166,255,0.15)}
            a.card .name{font-size:16px;font-weight:600}
            a.card .path{color:var(--text-dim);font-size:12px;font-family:"SFMono-Regular",Menlo,monospace;margin-top:4px}
            .empty{color:var(--text-dim);font-style:italic;margin-top:20px}
            footer{margin-top:auto;padding-top:40px;color:var(--text-dim);font-size:11px}
            footer a{color:var(--accent);text-decoration:none}
          </style>
          </head>
          <body>
          <h1>⚡ Swallow</h1>
          <div class="sub">Projects deployed on GitHub Pages</div>
          <div class="grid">
          HTML_HEAD

          if [ ${#DIRS[@]} -eq 0 ]; then
            echo '<div class="empty">No subdirectories with index.html were found.</div>'
          else
            for d in "${DIRS[@]}"; do
              echo "<a class=\"card\" href=\"${d}/\"><div class=\"name\">${d}</div><div class=\"path\">/${d}/</div></a>"
            done
          fi

          cat <<HTML_FOOT
          </div>
          <footer>
            Auto-generated on $(date -u +"%Y-%m-%d %H:%M UTC") &middot;
            <a href="https://github.com/${{ github.repository }}">${{ github.repository }}</a>
          </footer>
          </body>
          </html>
          HTML_FOOT
          } > "$OUT/index.html"

          # Jekyll処理を無効化（Actions公開では基本不要だが、保険として置く）。
          touch "$OUT/.nojekyll"

          echo "Assembled '$OUT' with ${#DIRS[@]} project(s)."

      # 【手順4】GitHub Pages を使う準備。
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 【手順5】公開用フォルダ(_site)だけを荷物にまとめる。
      #          path を '.' から '_site' に変えたのが元ファイルとの最大の違い。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      # 【手順6】まとめた荷物を GitHub Pages へ届けて公開。
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
